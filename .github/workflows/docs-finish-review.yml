name: Docs finish review
on:
  push:
    branches: [main]
    paths: [.github/workflows/docs-finish-review.yml]
permissions:
  contents: write
concurrency:
  group: docs-finish-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Recover the reviewed authored patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import base64, gzip, hashlib, subprocess, json, re, os
          previous = json.loads(subprocess.check_output(['gh','api','repos/' + os.environ['GITHUB_REPOSITORY'] + '/contents/.github/workflows/docs-finish-review.yml?ref=64636d81bf698afa4eba85e6564366b06535160c']))
          source = base64.b64decode(previous['content']).decode()
          encoded = re.search(r"b64decode\('([^']+)'\)", source)[1]
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '5acc849c447c3f2018a345c18e2af4bf9637a7c2a7d621a6c15d9175a5d877e7'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PYTHON
      - name: Apply and verify the static-rendering refinement
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          root=Path.cwd()
          def write(name,content):
              (root/name).write_text(content)
          write('docs/components/docs/code-frame.tsx', '"use client";\n\nimport type { ReactNode } from "react";\nimport { useLocale } from "@/i18n/locale-provider";\nimport { CopyButton } from "./copy-button";\nimport styles from "./copyable-code.module.css";\n\nexport type CodeProps = {\n  code: string;\n  lang: "bash" | "tsx" | "ts" | "css" | "json" | "text";\n  label?: string;\n  multiline?: boolean;\n};\n\n// Highlighted markup and the original clipboard bytes have separate owners.\nexport function CodeFrame({ code, lang, label, multiline = false, children }: CodeProps & { children: ReactNode }) {\n  const { messages } = useLocale();\n  const resolvedLabel = label ?? messages.common.code;\n  return (\n    <div\n      className={`code-shell ${styles.shell}${multiline ? ` ${styles.multiline}` : ""}`}\n      role="group"\n      aria-label={resolvedLabel}\n      data-code-language={lang}\n      data-code-theme="dark-plus"\n    >\n      {children}\n      <CopyButton text={code} label={`${messages.common.copy}: ${resolvedLabel}`} />\n    </div>\n  );\n}\n')
          write('docs/components/docs/code-highlight.tsx', 'import type { ComponentProps } from "react";\n\nexport function CodePre(props: ComponentProps<"pre">) {\n  return <pre {...props} tabIndex={0} />;\n}\n\nexport const darkPlusOptions = {\n  themes: { dark: "dark-plus" as const },\n  defaultColor: false as const,\n  components: { pre: CodePre },\n};\n')
          write('docs/components/docs/copyable-code.tsx', 'import { highlight } from "fumadocs-core/highlight";\nimport { CodeFrame, type CodeProps } from "./code-frame";\nimport { darkPlusOptions } from "./code-highlight";\n\n// Static documentation is highlighted during server/static rendering, not after hydration.\nexport async function CopyableCode(props: CodeProps) {\n  const content = await highlight(props.code, { ...darkPlusOptions, lang: props.lang });\n  return <CodeFrame {...props}>{content}</CodeFrame>;\n}\n')
          write('docs/components/docs/dynamic-code.tsx', '"use client";\n\nimport { Suspense } from "react";\nimport { useShiki } from "fumadocs-core/highlight/client";\nimport { CodeFrame, type CodeProps } from "./code-frame";\nimport { CodePre, darkPlusOptions } from "./code-highlight";\n\nfunction HighlightedCode({ code, lang }: Pick<CodeProps, "code" | "lang">) {\n  return useShiki(code, { ...darkPlusOptions, lang });\n}\n\n// Only fetched registry source and client-edited output need live highlighting.\nexport function DynamicCode(props: CodeProps) {\n  return (\n    <CodeFrame {...props}>\n      <Suspense fallback={<CodePre><code>{props.code}</code></CodePre>}>\n        <HighlightedCode code={props.code} lang={props.lang} />\n      </Suspense>\n    </CodeFrame>\n  );\n}\n')
          write('docs/components/docs/component-example.tsx', '"use client";\n\nimport type { ReactNode } from "react";\nimport { ComponentDetailPreview } from "@/components/docs/component-detail-preview";\nimport type { ComponentPreviewMessages } from "@/i18n/component-preview-messages";\nimport { useLocale } from "@/i18n/locale-provider";\nimport {\n  Tabs,\n  TabsContent,\n  TabsList,\n  TabsTrigger,\n} from "@neumorphism-ui/registry/ui/tabs";\n\ntype ComponentExampleProps = {\n  code: ReactNode;\n  copy: ComponentPreviewMessages;\n  slug: string;\n};\n\nexport function ComponentExample({\n  code,\n  copy,\n  slug,\n}: ComponentExampleProps) {\n  const { locale, messages } = useLocale();\n\n  return (\n    <Tabs className="component-example" defaultValue="preview">\n      <div className="component-example-toolbar">\n        <TabsList aria-label={messages.common.preview}>\n          <TabsTrigger value="preview">{messages.common.preview}</TabsTrigger>\n          <TabsTrigger value="code">{messages.common.code}</TabsTrigger>\n        </TabsList>\n      </div>\n      <TabsContent className="component-example-panel" value="preview">\n        {/* The stage owns the documentation width, not the installed control. */}\n        <div className="grid min-w-0 place-items-center" data-component-stage>\n          <ComponentDetailPreview copy={copy} locale={locale} slug={slug} />\n        </div>\n      </TabsContent>\n      <TabsContent className="component-example-code" value="code">\n        {code}\n      </TabsContent>\n    </Tabs>\n  );\n}\n')
          write('docs/components/docs/install-command.tsx', 'import type { Locale } from "@/i18n/config";\nimport { getMessages } from "@/i18n/messages";\n\nimport { CopyableCode } from "./copyable-code";\nimport { CopyButton } from "./copy-button";\nimport { getInstallCommand } from "./registry-config";\n\ntype InstallCommandProps = {\n  compact?: boolean;\n  name: string;\n  locale: Locale;\n  label?: string;\n};\n\nexport function InstallCommand({\n  compact = false,\n  name,\n  locale,\n  label,\n}: InstallCommandProps) {\n  const messages = getMessages(locale);\n  const command = getInstallCommand(name);\n  const resolvedLabel =\n    label ?? `${messages.common.installation}: ${name}`;\n\n  if (compact) {\n    return (\n      <div className="compact-install">\n        <code>{`@neumorphism-ui/${name}`}</code>\n        <CopyButton text={command} label={resolvedLabel} />\n      </div>\n    );\n  }\n\n  return <CopyableCode lang="bash" code={command} label={resolvedLabel} />;\n}\n')
          for name in ['component-installation.tsx','theme-studio.tsx']:
              p=root/'docs/components/docs'/name
              p.write_text(p.read_text().replace('CopyableCode','DynamicCode').replace('docs/copyable-code','docs/dynamic-code'))
          p=root/'docs/components/docs/component-installation.tsx'
          s=p.read_text().replace('import { InstallCommand } from "@/components/docs/install-command";\n','').replace('export function ComponentInstallation({ slug }: { slug: string }) {','export function ComponentInstallation({ slug, command }: { slug: string; command: React.ReactNode }) {').replace('<InstallCommand name={slug} />','{command}')
          p.write_text(s)
          for file in ['docs/src/pages/components/[slug].tsx','docs/src/pages/templates/[slug].tsx','docs/src/pages/charts.tsx','docs/src/pages/docs/installation.tsx','docs/src/pages/docs/registry.tsx']:
              p=root/file
              s=p.read_text().replace('<InstallCommand ', '<InstallCommand locale={locale} ')
              s=s.replace('<ComponentInstallation slug={component.slug} />', '<ComponentInstallation slug={component.slug} command={<InstallCommand locale={locale} name={component.slug} />} />')
              s=s.replace('code={component.usageCode}\n            copy={componentPreviewMessages[locale]}','code={<CopyableCode lang="tsx" code={component.usageCode} label={`${slug} ${messages.common.code}`} multiline />}\n            copy={componentPreviewMessages[locale]}')
              p.write_text(s)
          p=root/'docs/src/app.css'
          s=p.read_text()
          assert s.count('  font-size: 1.45rem;\n  letter-spacing: -0.035em;\n}\n\n') == 1
          s=s.replace('  font-size: 1.45rem;\n  letter-spacing: -0.035em;\n}\n\n', '  font-size: 1.45rem;\n  letter-spacing: -0.035em;\n  font-weight: 700;\n}\n\n')
          assert s.count('  color: var(--foreground-soft);\n  font-size: 0.82rem;\n}\n\n') == 1
          s=s.replace('  color: var(--foreground-soft);\n  font-size: 0.82rem;\n}\n\n', '  color: var(--foreground-soft);\n  font-size: 0.82rem;\n  font-weight: 500;\n}\n\n')
          p.write_text(s)
          p=root/'docs/tests/detail/docs-reading.spec.ts'
          s=p.read_text()
          assert s.count('  await page.goto("/en");\n  await page.evaluate(() => document.fonts.ready);\n  await page.locator(".component-directory-categories button").filter({ hasText: "Forms" }).click();\n  const cards = page.locator(".component-directory-card");\n') == 1
          s=s.replace('  await page.goto("/en");\n  await page.evaluate(() => document.fonts.ready);\n  await page.locator(".component-directory-categories button").filter({ hasText: "Forms" }).click();\n  const cards = page.locator(".component-directory-card");\n', '  await page.goto("/en");\n  await page.evaluate(() => document.fonts.ready);\n  await expect(page.locator(".component-directory-toolbar h2")).toHaveCSS("font-weight", "700");\n  await page.locator(".component-directory-categories button").filter({ hasText: "Forms" }).click();\n  const cards = page.locator(".component-directory-card");\n')
          assert s.count('  await page.mouse.move(0, 0); await page.mouse.up();\n  await expect(first).toHaveCSS("box-shadow", idle);\n  await first.focus();\n  await expect(first).toBeFocused();\n  await expect(first).toHaveCSS("outline-width", "2px");\n  await first.screenshot({ path: info.outputPath("directory-card-focus.png") });\n  await page.locator(".component-directory-results-head").scrollIntoViewIfNeeded();\n  await page.screenshot({ path: info.outputPath("directory-reading.png") });\n  expect(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth + 1)).toBe(true);\n  await first.press("Enter");\n') == 1
          s=s.replace('  await page.mouse.move(0, 0); await page.mouse.up();\n  await expect(first).toHaveCSS("box-shadow", idle);\n  await first.focus();\n  await expect(first).toBeFocused();\n  await expect(first).toHaveCSS("outline-width", "2px");\n  await first.screenshot({ path: info.outputPath("directory-card-focus.png") });\n  await page.locator(".component-directory-results-head").scrollIntoViewIfNeeded();\n  await page.screenshot({ path: info.outputPath("directory-reading.png") });\n  expect(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth + 1)).toBe(true);\n  await first.press("Enter");\n', '  await page.mouse.move(0, 0); await page.mouse.up();\n  await expect(first).toHaveCSS("box-shadow", idle);\n  await page.locator(".component-directory-results-head").scrollIntoViewIfNeeded();\n  await page.screenshot({ path: info.outputPath("directory-reading.png") });\n  await page.keyboard.press("Tab");\n  await first.focus();\n  await expect(first).toBeFocused();\n  await expect(first).toHaveCSS("outline-width", "2px");\n  await first.screenshot({ path: info.outputPath("directory-card-focus.png") });\n  expect(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth + 1)).toBe(true);\n  await first.press("Enter");\n')
          assert s.count('  const pre = await expectDarkPlus(preview);\n  const colors = await pre.locator("span[style]").evaluateAll(elements => elements.map(element => getComputedStyle(element).color));\n  expect(colors).toContain("rgb(197, 134, 192)"); // Dark+ import/export keyword.\n  expect(colors).toContain("rgb(206, 145, 120)"); // Dark+ string.\n  await pre.focus();\n  await expect(pre).toBeFocused();\n') == 1
          s=s.replace('  const pre = await expectDarkPlus(preview);\n  const colors = await pre.locator("span[style]").evaluateAll(elements => elements.map(element => getComputedStyle(element).color));\n  expect(colors).toContain("rgb(197, 134, 192)"); // Dark+ import/export keyword.\n  expect(colors).toContain("rgb(206, 145, 120)"); // Dark+ string.\n  await pre.focus();\n  await expect(pre).toBeFocused();\n', '  const pre = await expectDarkPlus(preview);\n  const colors = await pre.locator("span[style]").evaluateAll(elements => elements.map(element => getComputedStyle(element).color));\n  expect(colors).toContain("rgb(86, 156, 214)"); // Dark+ HTML tag.\n  expect(colors).toContain("rgb(206, 145, 120)"); // Dark+ string.\n  await page.locator(".component-example-code").scrollIntoViewIfNeeded();\n  await page.screenshot({ path: info.outputPath("code-reading.png") });\n  await pre.focus();\n  await expect(pre).toBeFocused();\n')
          assert s.count('    const page = await context.newPage();\n    await page.goto("/en/components/button");\n    const shell = page.locator("#usage .code-shell").last();\n    await expectDarkPlus(shell);\n') == 1
          s=s.replace('    const page = await context.newPage();\n    await page.goto("/en/components/button");\n    const shell = page.locator("#usage .code-shell").last();\n    await expectDarkPlus(shell);\n', '    const page = await context.newPage();\n    await page.goto("/en/components/button");\n    await expectDarkPlus(page.locator(".component-installation .code-shell"));\n    await expectDarkPlus(page.locator("#usage .code-shell").first());\n    const shell = page.locator("#usage .code-shell").last();\n    await expectDarkPlus(shell);\n')
          p.write_text(s)
          p=root/'docs/visual-reference.md'
          s=p.read_text()
          assert s.count('The same tests also run against the published origin. No installable item or package\nis added by this documentation change.\n') == 1
          s=s.replace('The same tests also run against the published origin. No installable item or package\nis added by this documentation change.\n', 'The same tests also run against the published origin. No installable item or package\nis added by this documentation change.\n\nStatic documentation is highlighted in the server/static-rendering layer and passed\nas content into the client tab and clipboard frame. Only client-edited output and\nfetched registry source use the live renderer. Both renderers share the same Dark+\noptions, pre geometry and clipboard surface. No-JavaScript checks verify that\nstatic usage snippets already contain the actual colored token markup.\n')
          p.write_text(s)
          expected={'docs/components/docs/code-frame.tsx': '9f608226116d02659a9390fa0bc53aa10fa0e5f829e09757820efc66863ea4b7', 'docs/components/docs/code-highlight.tsx': 'a22341b291d26383c2cb1f7810f005c9bf818fda0fc46eeeb6f2abd541f4af4e', 'docs/components/docs/component-example.tsx': 'ca473193796c72d7327d21787abf5ec79c774659c4763db7ea5393c2e1bdaaa1', 'docs/components/docs/component-installation.tsx': '0de1911d3e913f8aab30e7aca955a7a23085b732214f730d9ead8ab9e6d58f15', 'docs/components/docs/copyable-code.tsx': '15a6f51bc987b9f6ab6521b4060f82559123b2b3da4651529088ea0f7cbc05bd', 'docs/components/docs/dynamic-code.tsx': '53fd16810736394e283ebf6ec3a9d30c0d40576df67c3d79a87bfd1865bdeb82', 'docs/components/docs/install-command.tsx': '78658b39b227cf42469b4d7139ce3de12080715189e7b19ccf8348a5a7d3667d', 'docs/components/docs/theme-studio.tsx': '99d7b3acac3e540e0ccbac0f312641c11baf32e0b54d749fe2ddce16854cbc71', 'docs/src/app.css': '602d6adf03ff4acbf39a14bd59cdf3866c0bcaedf99c5cd3dc89887d90432dd1', 'docs/src/pages/charts.tsx': 'af7256faebcd932eca58aaef6df141c195185c52db85e046562e70722456f17f', 'docs/src/pages/components/[slug].tsx': '291ab6efeb46874e409fbde449c4dbf2d3f8f423cfa4e0e961be023128bbcecf', 'docs/src/pages/docs/installation.tsx': 'd526275e478ff575543af0663aa21b933bd89535a3182ab64a944096937fd5a5', 'docs/src/pages/docs/registry.tsx': '084ce65e8378fe6ae85b0eea02058fe51bbc0706cabeb11849714232363125d5', 'docs/src/pages/templates/[slug].tsx': '0e0b69e43ed0f4d1897642ace5e81c281a63a8fd1e5750a017b0f84743757890', 'docs/tests/detail/docs-reading.spec.ts': '630eade96f0e2fa5e8544d196b65581e16538b0665069a1865ab4778aa585e48', 'docs/visual-reference.md': '969a2fe8f68b0d7a8e3a20d2e346d691c27cae9ec3134d76dfb8d662460dd836'}
          for name,digest in expected.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest() == digest, name
          PYTHON
      - name: Build and verify source synchronization
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          git diff --check
      - name: Install browser
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Targeted material, typography and code verification
        working-directory: docs
        run: npx playwright test --config=playwright.detail.config.ts tests/detail/docs-reading.spec.ts tests/detail/document-rhythm.spec.ts
      - name: Prepare exact clean candidate without moving main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run check:generated --prefix registry
          git rm .github/workflows/docs-finish-review.yml
          git add -A
          git diff --cached --check
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base=git('rev-parse','HEAD')
          assert base == os.environ['GITHUB_SHA']
          assert git('ls-remote','origin','refs/heads/main').split()[0] == base, 'main moved; preserve user changes'
          entries=[]
          for name in filter(None,subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')):
              p=Path(name)
              if p.exists():
                  assert p.is_file() and not p.is_symlink(),name
                  entries.append({'path':name,'mode':git('ls-files','--stage','--',name).split()[0],'type':'blob','content':p.read_text()})
              else:
                  entries.append({'path':name,'mode':'100644','type':'blob','sha':None})
          temp=Path(os.environ['RUNNER_TEMP'])
          (temp/'tree-input.json').write_text(json.dumps({'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries}))
          (temp/'candidate.json').write_text(json.dumps({'base_commit':base,'changed_paths':[e['path'] for e in entries],'run_id':os.environ['GITHUB_RUN_ID'],'temporary_workflow_removed':True,'stats':json.loads(Path('docs/test-results/detail-report.json').read_text())['stats']},indent=2))
          PYTHON
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input "$RUNNER_TEMP/tree-input.json" > "$RUNNER_TEMP/tree-response.json"
          python3 - <<'PYTHON'
          import os,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);info=json.loads((root/'candidate.json').read_text())
          info['tree_sha']=json.loads((root/'tree-response.json').read_text())['sha']
          (root/'candidate.json').write_text(json.dumps(info,indent=2));print(json.dumps(info,indent=2))
          PYTHON
          git diff --cached --binary > "$RUNNER_TEMP/candidate.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: docs-finish-candidate
          path: |
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/candidate.patch
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: docs-finish-visuals
          path: |
            docs/test-results/docs-browser/catalog
            docs/test-results/detail-report.json
          retention-days: 7
          if-no-files-found: warn
