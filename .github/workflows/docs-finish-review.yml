name: Docs finish review
on:
  push:
    branches: [main]
    paths: [.github/workflows/docs-finish-review.yml]
permissions:
  contents: write
concurrency:
  group: docs-finish-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Apply only the reviewed authored changes
        run: |
          python3 - <<'PYTHON'
          import base64, gzip, hashlib, subprocess
          patch = gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest() == '5acc849c447c3f2018a345c18e2af4bf9637a7c2a7d621a6c15d9175a5d877e7'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PYTHON
      - name: Build and verify source synchronization
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          git diff --check
      - name: Install browser
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Targeted material, typography and code verification
        working-directory: docs
        run: npx playwright test --config=playwright.detail.config.ts tests/detail/docs-reading.spec.ts tests/detail/document-rhythm.spec.ts
      - name: Prepare exact clean candidate without moving main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run check:generated --prefix registry
          git rm .github/workflows/docs-finish-review.yml
          git add -A
          git diff --cached --check
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = git('rev-parse', 'HEAD')
          assert base == os.environ['GITHUB_SHA']
          assert git('ls-remote', 'origin', 'refs/heads/main').split()[0] == base, 'main moved; preserve user changes'
          entries = []
          paths = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          for name in filter(None, paths):
              p = Path(name)
              if p.exists():
                  assert p.is_file() and not p.is_symlink(), name
                  entries.append({'path':name, 'mode':git('ls-files','--stage','--',name).split()[0], 'type':'blob', 'content':p.read_text()})
              else:
                  entries.append({'path':name,'mode':'100644','type':'blob','sha':None})
          temp=Path(os.environ['RUNNER_TEMP'])
          (temp/'tree-input.json').write_text(json.dumps({'base_tree':git('rev-parse','HEAD^{tree}'), 'tree':entries}))
          info={'base_commit':base,'changed_paths':[e['path'] for e in entries], 'run_id':os.environ['GITHUB_RUN_ID'], 'temporary_workflow_removed':True,
                'stats':json.loads(Path('docs/test-results/detail-report.json').read_text())['stats']}
          (temp/'candidate.json').write_text(json.dumps(info,indent=2))
          PYTHON
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input "$RUNNER_TEMP/tree-input.json" > "$RUNNER_TEMP/tree-response.json"
          python3 - <<'PYTHON'
          import os,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);info=json.loads((root/'candidate.json').read_text())
          info['tree_sha']=json.loads((root/'tree-response.json').read_text())['sha']
          (root/'candidate.json').write_text(json.dumps(info,indent=2));print(json.dumps(info,indent=2))
          PYTHON
          git diff --cached --binary > "$RUNNER_TEMP/candidate.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: docs-finish-candidate
          path: |
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/candidate.patch
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: docs-finish-visuals
          path: |
            docs/test-results/docs-browser/catalog
            docs/test-results/detail-report.json
          retention-days: 7
          if-no-files-found: warn
