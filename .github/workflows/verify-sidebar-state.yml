name: Verify sidebar state ownership (temporary)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-sidebar-state.yml
      - registry/src/components/ui/sidebar.tsx
      - docs/tests/material/micro-completion.spec.ts
permissions:
  contents: write
concurrency:
  group: sidebar-state-main
  cancel-in-progress: false
jobs:
  reproduce-and-sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Build installable source and synchronize documentation
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm run check:generated --prefix registry
      - name: Install Chromium
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Exercise actual SidebarProvider source in both modes and desktop sizes
        working-directory: docs
        run: npx playwright test --config=playwright.material.config.ts tests/material/micro-completion.spec.ts -g SidebarProvider
      - name: Verify source and documentation contracts
        run: |
          npm run lint --prefix registry
          npm test --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          npm run check:generated --prefix registry
      - name: Commit generated sidebar endpoints after passing tests
        run: |
          git add registry/public/r/sidebar.json docs/public/r/sidebar.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Expected source-derived sidebar endpoints to change" >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "build: synchronize SidebarProvider state ownership registry"
          git push origin HEAD:main
      - name: Save focused browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sidebar-state-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            docs/test-results/material-report.json
            docs/test-results/docs-browser/material-after/**/trace.zip
