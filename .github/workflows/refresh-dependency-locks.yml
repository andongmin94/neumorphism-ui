name: Refresh dependency locks
on:
  push:
    branches: [main]
    paths:
      - "registry/package.json"
      - "docs/package.json"
      - ".github/workflows/refresh-dependency-locks.yml"
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts --prefix registry
          npm install --package-lock-only --ignore-scripts --prefix docs
      - name: Commit lockfiles
        run: |
          if git diff --quiet -- registry/package-lock.json docs/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/package-lock.json docs/package-lock.json
          git commit -m "chore: refresh dependency lockfiles"
          git push origin HEAD:main
