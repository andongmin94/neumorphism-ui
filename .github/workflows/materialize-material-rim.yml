name: Materialize directional rim (temporary)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-material-rim.yml
      - registry/src/theme.ts
permissions:
  contents: write
jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - run: npm ci --prefix registry && npm ci --prefix docs
      - name: Generate from owned source and validate
        run: |
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run typecheck --prefix docs
          npm run build --prefix docs
      - name: Commit generated registry and documentation to main
        run: |
          git add -u registry docs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Expected generated outputs to change" >&2
            exit 1
          fi
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "build: regenerate directional neumorphic rim outputs"
          git push origin HEAD:main
      - name: Install Chromium for source and documentation captures
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Capture updated Button and Card in desktop and mobile, light and dark
        working-directory: docs
        run: npx playwright test --config=playwright.detail.config.ts tests/detail/light-refinement.spec.ts
      - name: Save Button and Card snapshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: directional-rim-button-card
          path: |
            docs/test-results/docs-browser/catalog/**/button.png
            docs/test-results/docs-browser/catalog/**/card.png
            docs/test-results/detail-report.json
          retention-days: 7
          if-no-files-found: warn
