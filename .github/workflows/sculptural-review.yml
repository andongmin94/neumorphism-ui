name: Sculptural detail review
on:
  push:
    branches: [main]
    paths: [.github/workflows/sculptural-review.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Prepare source geometry and composition
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          theme = Path('registry/src/theme.ts')
          text = theme.read_text()
          # Air's default geometry is compact; keep the other presets and user settings distinct.
          start = text.index('    id: "air",')
          end = text.index('    light: {', start)
          block = text[start:end]
          assert 'surfaceRadius: 18,' in block
          text = text[:start] + block.replace('surfaceRadius: 18,', 'surfaceRadius: 12,') + text[end:]
          start = text.index('export const defaultThemeSettings:')
          end = text.index('const depthProfiles:', start)
          block = text[start:end]
          assert 'surfaceRadius: 18,' in block
          text = text[:start] + block.replace('surfaceRadius: 18,', 'surfaceRadius: 12,') + text[end:]
          theme.write_text(text)
          card = Path('registry/src/components/ui/card.tsx')
          text = card.read_text()
          for before, after in [
              ('[background-image:var(--neu-fill-raised)] shadow-[var(--neu-shadow-raised)]', '[background-image:var(--neu-fill-raised)] shadow-[var(--neu-shadow-raised-sm)]'),
              ('soft: "bg-[var(--neu-surface-soft)] shadow-[var(--neu-shadow-raised-sm)]"', 'soft: "bg-[var(--neu-surface-soft)] shadow-none"'),
              ('flex flex-col gap-5 rounded-[var(--neu-radius-surface)] border border-transparent py-6', 'flex min-w-0 flex-col gap-4 rounded-[var(--neu-radius-surface)] border border-transparent py-5'),
              ('transition-[transform,box-shadow]', 'transition-shadow'),
              ('grid auto-rows-min gap-1.5 px-6 has-[>[data-slot=card-action]]:grid-cols-[1fr_auto]', 'grid min-w-0 auto-rows-min gap-x-4 gap-y-1 px-5 has-[>[data-slot=card-action]]:grid-cols-[minmax(0,1fr)_auto]'),
              ('text-lg font-semibold leading-none tracking-tight', 'min-w-0 text-base font-semibold leading-6 tracking-tight [overflow-wrap:anywhere]'),
              ('text-sm leading-relaxed text-[var(--muted-foreground)]', 'min-w-0 text-sm leading-relaxed text-[var(--muted-foreground)] [overflow-wrap:anywhere]'),
              ('cn("px-6", className)', 'cn("min-w-0 px-5", className)'),
              ('cn("flex items-center px-6", className)', 'cn("flex min-w-0 flex-wrap items-center gap-3 px-5", className)'),
          ]:
              assert before in text, before
              text = text.replace(before, after)
          card.write_text(text)
          Path('docs/components/docs/theme-preview.tsx').write_text('''"use client";
          
          import { useId, useRef, useState, type CSSProperties, type FormEvent } from "react";
          import { Link } from "fumapress/client";
          import { Alert, AlertDescription, AlertTitle } from "@neumorphism-ui/registry/ui/alert";
          import { Button } from "@neumorphism-ui/registry/ui/button";
          import { Card } from "@neumorphism-ui/registry/ui/card";
          import { Input } from "@neumorphism-ui/registry/ui/input";
          import { Progress } from "@neumorphism-ui/registry/ui/progress";
          import { Switch } from "@neumorphism-ui/registry/ui/switch";
          import { localeHref, type Locale } from "@/i18n/config";
          import type { getMessages } from "@/i18n/messages";
          import styles from "./theme-preview.module.css";
          
          const words = {
            en: { demo: "Local preview only. No alert is sent.", saved: "Target", current: "Current price", paused: "Alerts paused", removed: "Alert removed. Save a target to recreate it.", invalid: "Enter a price greater than zero.", progress: "Of target", edit: "Set your target", reset: "Reset", unsaved: "Unsaved target", savedState: "Target saved", noTarget: "No target" },
            ko: { demo: "로컬 미리보기입니다. 알림을 전송하지 않습니다.", saved: "목표 가격", current: "현재 가격", paused: "알림 일시 정지", removed: "알림을 삭제했습니다. 목표 가격을 저장하면 다시 만들 수 있습니다.", invalid: "0보다 큰 가격을 입력하세요.", progress: "목표 대비", edit: "목표 가격 설정", reset: "되돌리기", unsaved: "저장하지 않은 목표", savedState: "목표 저장됨", noTarget: "목표 없음" },
            ja: { demo: "ローカルプレビューです。通知は送信されません。", saved: "目標価格", current: "現在価格", paused: "通知を一時停止", removed: "通知を削除しました。目標価格を保存すると再作成できます。", invalid: "0より大きい価格を入力してください。", progress: "目標比", edit: "目標価格を設定", reset: "元に戻す", unsaved: "未保存の目標", savedState: "目標を保存しました", noTarget: "目標なし" },
            zh: { demo: "仅为本地预览，不会发送提醒。", saved: "目标价格", current: "当前价格", paused: "提醒已暂停", removed: "已删除提醒。保存目标价格即可重新创建。", invalid: "请输入大于零的价格。", progress: "目标比例", edit: "设置目标价格", reset: "还原", unsaved: "未保存的目标", savedState: "目标已保存", noTarget: "无目标" },
          } as const;
          
          type Props = {
            copy: ReturnType<typeof getMessages>["themeStudio"];
            locale: Locale;
            previewMode: "light" | "dark";
            style: CSSProperties;
          };
          
          const currentPrice = 188.32;
          
          export function ThemePreview({ copy, locale, previewMode, style }: Props) {
            const t = words[locale];
            const id = useId();
            const input = useRef<HTMLInputElement>(null);
            const [draft, setDraft] = useState("210");
            const [saved, setSaved] = useState<number | null>(210);
            const [notifications, setNotifications] = useState(true);
            const [invalid, setInvalid] = useState(false);
            const dirty = saved === null || Number(draft) !== saved;
            const progress = saved === null ? 0 : Math.min(100, currentPrice / saved * 100);
            const money = new Intl.NumberFormat(locale, { style: "currency", currency: "USD" });
          
            function save(event: FormEvent<HTMLFormElement>) {
              event.preventDefault();
              const price = Number(draft);
              if (!Number.isFinite(price) || price <= 0) {
                setInvalid(true);
                input.current?.focus();
                return;
              }
              setSaved(price);
              setDraft(String(price));
              setInvalid(false);
            }
          
            return (
              <div className={styles.canvas} data-theme-price-preview data-preview-mode={previewMode} style={style}>
                <header className={styles.heading}>
                  <div>
                    <p className={styles.eyebrow}>NVDA <span>NASDAQ</span></p>
                    <h2>{copy.priceAlert}</h2>
                  </div>
                  <span className={styles.state} data-dirty={dirty || undefined}>
                    <span aria-hidden="true" />
                    {saved === null ? t.noTarget : dirty ? t.unsaved : t.savedState}
                  </span>
                </header>
          
                <dl className={styles.metrics} data-price-metrics>
                  <Card className={`${styles.metric} ${styles.featured}`} variant="raised">
                    <dt>{t.current}</dt><dd>{money.format(currentPrice)}</dd>
                  </Card>
                  <Card className={styles.metric} variant="inset">
                    <dt>{t.saved}</dt><dd>{saved === null ? "—" : money.format(saved)}</dd>
                  </Card>
                  <Card className={styles.metric} variant="inset">
                    <dt>{copy.changeToday}</dt><dd>+2.14%</dd>
                  </Card>
                  <Card className={styles.metric} variant="inset">
                    <dt>{t.progress}</dt><dd>{saved === null ? "—" : `${Math.round(progress)}%`}</dd>
                  </Card>
                </dl>
          
                <div className={styles.body}>
                  <section className={styles.editor} aria-labelledby={`${id}-edit`}>
                    <h3 id={`${id}-edit`}>{t.edit}</h3>
                    <form className={styles.form} noValidate onSubmit={save}>
                      <label htmlFor={`${id}-price`}>{copy.targetPrice} <span>USD</span></label>
                      <div className={styles.fieldRow}>
                        <Input ref={input} id={`${id}-price`} type="number" inputMode="decimal" min="0.01" step="0.01" value={draft} aria-invalid={invalid || undefined} aria-describedby={invalid ? `${id}-error` : undefined} onChange={event => { setDraft(event.target.value); setInvalid(false); }} />
                        <Button type="submit" variant="primary" disabled={!dirty}>{copy.save}</Button>
                      </div>
                      {invalid && <p id={`${id}-error`} className={styles.error} role="alert">{t.invalid}</p>}
                    </form>
                    <div className={styles.progress}>
                      <span><strong>{copy.currentPrice}</strong><small>{Math.round(progress)}% {t.progress.toLocaleLowerCase(locale)}</small></span>
                      <Progress aria-label={copy.targetProgress} value={progress} />
                    </div>
                    <footer className={styles.footer}>
                      <Link className={styles.chartLink} href={localeHref(locale, "/charts")}>
                        {copy.viewChart}
                        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M7 17 17 7M7 7h10v10" /></svg>
                      </Link>
                      <Button variant="ghost" disabled={saved === null} onClick={() => { setSaved(null); setInvalid(false); }}>{copy.deleteAlert}</Button>
                    </footer>
                  </section>
          
                  <section className={styles.conditions} aria-labelledby={`${id}-conditions`}>
                    <h3 id={`${id}-conditions`}>{copy.alertConditions}</h3>
                    <p>{copy.pushAtTarget}</p>
                    <label className={styles.toggleRow}>
                      <span><strong>{copy.realtimeAlerts}</strong><small>{notifications ? copy.on : copy.off}</small></span>
                      <Switch checked={notifications} onCheckedChange={setNotifications} />
                    </label>
                    <Alert className={styles.status} variant="default" role="status">
                      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d={saved !== null && notifications ? "m5 12 4 4L19 6" : "M8 6v12M16 6v12"} /></svg>
                      <AlertTitle>{saved === null ? t.removed : notifications ? copy.alertEnabled : t.paused}</AlertTitle>
                      <AlertDescription>
                        {saved !== null && <span>{t.saved}: {money.format(saved)}</span>}
                        <span>{t.demo}</span>
                      </AlertDescription>
                    </Alert>
                  </section>
                </div>
              </div>
            );
          }
          ''')
          Path('docs/components/docs/theme-preview.module.css').write_text('''.canvas {
            container-type: inline-size;
            min-width: 0;
            padding: clamp(20px, 3vw, 32px);
            background: var(--neu-surface);
            color: var(--foreground);
            font-family: var(--neu-font-sans);
          }
          .heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
          .eyebrow { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font-size: 11px; font-weight: 750; letter-spacing: .06em; }
          .eyebrow span { border-left: 1px solid var(--border); padding-left: 10px; color: var(--muted-foreground); font-weight: 500; }
          .heading h2 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.035em; line-height: 1.2; }
          .state { display: inline-flex; align-items: center; gap: 7px; color: var(--muted-foreground); font-size: 12px; }
          .state > span { width: 5px; height: 5px; flex: none; border-radius: 50%; background: currentColor; }
          .state[data-dirty] { color: var(--primary); }
          .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin: 0 0 32px; }
          .metric { display: grid; min-width: 0; min-height: 116px; align-content: center; justify-items: center; gap: 8px; padding: 18px 10px; border-radius: calc(var(--neu-radius-surface) * .6); text-align: center; }
          .metric dt { grid-row: 2; color: var(--muted-foreground); font-size: 12px; line-height: 1.35; }
          .metric dd { grid-row: 1; min-width: 0; margin: 0; color: var(--foreground); font-size: clamp(23px, 3.4cqi, 32px); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.045em; line-height: 1.15; }
          .featured dd, .featured dt { color: var(--primary); }
          .body { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 36px; }
          .editor, .conditions { min-width: 0; }
          .body h3 { margin: 0 0 16px; font-size: 15px; font-weight: 650; letter-spacing: -.02em; line-height: 1.4; }
          .form { display: grid; gap: 8px; }
          .form label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; font-weight: 600; }
          .form label span { color: var(--muted-foreground); font-size: 11px; font-weight: 500; }
          .fieldRow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 12px; }
          .fieldRow > input { font-variant-numeric: tabular-nums; }
          .error { margin: 0; color: var(--neu-error-text); font-size: 13px; line-height: 1.5; }
          .progress { display: grid; gap: 10px; margin-top: 22px; }
          .progress > span { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
          .progress strong { font-size: 12px; font-weight: 550; }
          .progress small { color: var(--muted-foreground); font-size: 11px; }
          .footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; }
          .chartLink { display: inline-flex; min-height: 40px; align-items: center; gap: 6px; color: var(--foreground); font-size: 13px; font-weight: 600; text-decoration: none; }
          .chartLink:hover { color: var(--primary); }
          .chartLink:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; border-radius: 4px; }
          .conditions { border-left: 1px solid var(--border); padding-left: 28px; }
          .conditions > h3 { margin-bottom: 4px; }
          .conditions > p { margin: 0; color: var(--muted-foreground); font-size: 12px; line-height: 1.5; }
          .toggleRow { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 16px; }
          .toggleRow > span { display: grid; gap: 4px; }
          .toggleRow strong { font-size: 12px; font-weight: 600; }
          .toggleRow small { color: var(--muted-foreground); font-size: 11px; }
          .status { margin-top: 16px; padding: 16px 0 0; border: 0; border-top: 1px solid var(--border); border-radius: 0; background: transparent; box-shadow: none; }
          .status [data-slot="alert-title"] { font-size: 12px; }
          .status [data-slot="alert-description"] { color: var(--muted-foreground); font-size: 12px; }
          @container (max-width: 580px) {
            .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
            .metric dd { font-size: 28px; }
            .body { grid-template-columns: minmax(0, 1fr); gap: 24px; }
            .conditions { border-left: 0; border-top: 1px solid var(--border); padding: 20px 0 0; }
          }
          @container (max-width: 340px) {
            .heading { margin-bottom: 24px; gap: 10px; }
            .metrics { gap: 14px; margin-bottom: 28px; }
            .metric { min-height: 100px; padding-inline: 8px; }
            .metric dd { font-size: 24px; }
            .metric dt { font-size: 11px; }
          }
          ''')
          # Remove old owning rules; the new canvas has one CSS module, not a later override.
          css = Path('docs/src/app.css')
          text = css.read_text()
          names = re.compile(r'\.(?:theme-preview-(?:canvas|profile|side|settings|field|progress)|theme-elevation-strip)(?![\w-])')
          removed = []
          def prune(match):
              selectors, declarations = match.groups()
              if not names.search(selectors):
                  return match.group(0)
              parts = selectors.split(',')
              kept = [part for part in parts if not names.search(part)]
              removed.extend(part.strip() for part in parts if names.search(part))
              return ','.join(kept) + '{' + declarations + '}' if kept else ''
          text = re.sub(r'([^{}]+)\{([^{}]*)\}', prune, text)
          assert not names.search(text), 'Old preview presentation selector remains'
          assert removed, 'No obsolete rules removed'
          css.write_text(text)
          print('REMOVED_PREVIEW_RULES', removed)
          Path('docs/tests/detail/sculptural-layout.spec.ts').write_text('''import { expect, test } from "@playwright/test";
          
          test("reference composition has one lifted value and no nested card frame", async ({ page }, info) => {
            await page.goto("/en/customize");
            const canvas = page.locator("[data-theme-price-preview]");
            await expect(canvas).toBeVisible();
            await page.evaluate(() => document.fonts.ready);
            const metrics = canvas.locator("[data-price-metrics]");
            const cards = metrics.locator('[data-slot="card"]');
            await expect(cards).toHaveCount(4);
            await expect(metrics.locator('[data-variant="raised"]')).toHaveCount(1);
            await expect(metrics.locator('[data-variant="inset"]')).toHaveCount(3);
            await expect(canvas.locator('[data-slot="card"] [data-slot="card"]')).toHaveCount(0);
            await expect(canvas).toHaveCSS("box-shadow", "none");
            for (const card of await cards.all()) {
              const value = await card.locator("dd").boundingBox();
              const label = await card.locator("dt").boundingBox();
              const rect = await card.boundingBox();
              expect(value!.y + value!.height).toBeLessThanOrEqual(label!.y - 6);
              expect(value!.x).toBeGreaterThanOrEqual(rect!.x);
              expect(value!.x + value!.width).toBeLessThanOrEqual(rect!.x + rect!.width);
              expect(label!.x).toBeGreaterThanOrEqual(rect!.x);
              expect(label!.x + label!.width).toBeLessThanOrEqual(rect!.x + rect!.width);
              expect(Math.abs(value!.x + value!.width / 2 - rect!.x - rect!.width / 2)).toBeLessThan(1);
            }
            const input = canvas.locator('input[type="number"]');
            const button = canvas.getByRole("button", { name: "Save", exact: true });
            await input.fill("240");
            // The saved readout does not pretend an uncommitted draft is already active.
            await expect(cards.nth(1).locator("dd")).toHaveText("$210.00");
            await button.click();
            await expect(cards.nth(1).locator("dd")).toHaveText("$240.00");
            await expect(cards.nth(3).locator("dd")).toHaveText("78%");
            await expect(button).toBeDisabled();
            await canvas.screenshot({ path: info.outputPath("sculptural-saved.png"), animations: "disabled" });
            await canvas.getByRole("button", { name: "Delete alert", exact: true }).click();
            await expect(cards.nth(1).locator("dd")).toHaveText("—");
            await expect(cards.nth(3).locator("dd")).toHaveText("—");
            await input.fill("0");
            await button.click();
            await expect(input).toHaveAttribute("aria-invalid", "true");
            await expect(input).toBeFocused();
            await input.fill("250");
            await button.click();
            await expect(cards.nth(1).locator("dd")).toHaveText("$250.00");
            await canvas.screenshot({ path: info.outputPath("sculptural-recovered.png"), animations: "disabled" });
          });
          
          test("card typography, radius and footer keep content inside the physical plate", async ({ page }, info) => {
            await page.goto("/en/components/card");
            const panel = page.locator("[data-component-stage]");
            const card = panel.locator('[data-slot="card"]').first();
            await expect(card).toBeVisible();
            expect(await card.evaluate(e => parseFloat(getComputedStyle(e).borderTopLeftRadius))).toBe(12);
            const title = card.locator('[data-slot="card-title"]');
            await title.evaluate(e => { e.textContent = "A longer workspace title that must wrap without touching its action"; });
            const description = card.locator('[data-slot="card-description"]');
            await description.evaluate(e => { e.textContent = "https://example.test/a-very-long-unbroken-workspace-identifier-with-no-spaces"; });
            const bounds = await card.boundingBox();
            for (const child of [title, description, card.locator('[data-slot="card-action"]')]) {
              const b = await child.boundingBox();
              expect(b!.x).toBeGreaterThanOrEqual(bounds!.x);
              expect(b!.x + b!.width).toBeLessThanOrEqual(bounds!.x + bounds!.width);
            }
            const t = await title.boundingBox();
            const a = await card.locator('[data-slot="card-action"]').boundingBox();
            expect(t!.x + t!.width + 12).toBeLessThanOrEqual(a!.x);
            expect(await page.evaluate(() => document.documentElement.scrollWidth)).toBeLessThanOrEqual(page.viewportSize()!.width + 1);
            await panel.screenshot({ path: info.outputPath("card-long-content.png"), animations: "disabled" });
          });
          
          test("reference composition keeps geometry in all document locales", async ({ page }, info) => {
            for (const locale of ["en", "ko", "ja", "zh"]) {
              await page.goto(`/${locale}/customize`);
              const canvas = page.locator("[data-theme-price-preview]");
              await expect(canvas.locator("[data-price-metrics] dt")).toHaveCount(4);
              expect(await canvas.evaluate(e => e.scrollWidth <= e.clientWidth + 1)).toBe(true);
              expect(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth + 1)).toBe(true);
              await canvas.screenshot({ path: info.outputPath(`sculptural-${locale}.png`), animations: "disabled" });
            }
          });
          ''')
          Path('docs/visual-reference.md').write_text('''# Sculptural reference review
          
          Reference: the public example image in Paran Penguin item 1379, not the store UI or a licensed source deck.
          
          ## Decisions implemented
          
          - The central statistic row is the composition reference: one raised accent tile and three recessed, neutral tiles. Values and labels share a centreline, equal tile dimensions and a common gap.
          - The surrounding preview is an open, same-material canvas. It does not put a raised card inside an inset card. Form and conditions use spacing and a separator instead of additional shells.
          - Air's default surface corner is 12px. Small statistic tiles use 60% of the selected surface radius so small faces do not look inflated. Other presets remain distinct.
          - Installable Card uses the small contact shadow, 20px gutters, 16px section gaps, a wrapping title with 24px line height and a wrapping footer. Soft structural cards no longer claim the same raised level.
          - Geometry responds to the preview's own width, not just the browser width. Values and labels remain in their cells at 390px and all four document locales.
          - Saved numeric readouts are derived from the same local state as the form and progress bar. Drafts do not silently change saved values. Delete, validation and recovery are preserved.
          
          ## Deliberate boundaries
          
          The diamond infographic and circular gauges are not copied into the documentation or added as new registry components. This pass translates the reference's plate proportions, internal spacing and depth hierarchy into the existing Card and Theme Studio composition. It is not a reproduction of the full deck. Numerical chart marks remain flat.
          
          ## Evidence
          
          `tests/detail/sculptural-layout.spec.ts` checks the depth count, nesting, centred readouts, internal bounds, long content, locale reflow and draft/save/delete/recovery behavior. The permanent Verify workflow also runs the existing complete catalog, material and documentation interaction suites. Screenshots are visual-review evidence, not proof that every possible composition is complete.
          ''')
          PY
      - name: Static source and generated output
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
      - name: Browser
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Compare anatomy before the full catalog
        working-directory: docs
        run: npx playwright test --config=playwright.detail.config.ts sculptural-layout.spec.ts --max-failures=1
      - name: Existing catalog, material and shell contracts
        working-directory: docs
        run: |
          result=0
          npx playwright test --config=playwright.detail.config.ts || result=1
          npx playwright test --config=playwright.material.config.ts || result=1
          npx playwright test tests/browser/presentation.spec.ts tests/browser/docs-polish.spec.ts || result=1
          exit "$result"
      - name: Prepare reviewed tree without changing main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/sculptural-review.yml
          git add -A
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, mkdirSync, writeFileSync } from 'node:fs';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const paths = git('diff', '--cached', '--name-only', '-z').split('\0').filter(Boolean);
          const removed = new Set(git('diff', '--cached', '--name-only', '--diff-filter=D', '-z').split('\0'));
          const tree = paths.map(path => removed.has(path)
            ? { path, mode: '100644', type: 'blob', sha: null }
            : { path, mode: '100644', type: 'blob', content: readFileSync(path, 'utf8') });
          if (!removed.has('.github/workflows/sculptural-review.yml')) throw new Error('Temporary review workflow must not ship');
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/trees`, {
            method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ base_tree: git('rev-parse', 'HEAD^{tree}'), tree }),
          });
          const body = await response.json();
          if (!response.ok) throw new Error(JSON.stringify(body));
          const record = { parent: process.env.GITHUB_SHA, tree: body.sha, files: paths };
          mkdirSync('docs/test-results/sculptural', { recursive: true });
          writeFileSync('docs/test-results/sculptural/prepared-tree.json', JSON.stringify(record, null, 2));
          writeFileSync('docs/test-results/sculptural/source.diff', git('diff', '--cached'));
          console.log('PREPARED_TREE ' + JSON.stringify(record));
          JS
      - name: Review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sculptural-review
          path: docs/test-results
          if-no-files-found: error
          retention-days: 7
