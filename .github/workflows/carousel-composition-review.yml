name: Carousel composition review
on:
  push:
    branches: [main]
    paths: [.github/workflows/carousel-composition-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Capture unchanged carousel composition
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/carousel-review
          npm ci --prefix registry
          npm ci --prefix docs
          npm run build --prefix docs
          cd docs
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.detail.config.ts --grep 'catalog detail: carousel$' --output=test-results/docs-browser/carousel-before
      - name: Give raised example plates breathing room inside the existing masked viewport
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=['docs/components/docs/expanded-component-preview.tsx','docs/components/docs/component-docs-data.ts','docs/i18n/component-usage-code.en.ts','docs/i18n/component-usage-code.ja.ts','docs/i18n/component-usage-code.zh.ts']
          for filename in paths:
            p=Path(filename);s=p.read_text();start='<CarouselItem key={item}>';end='</CarouselItem>'
            assert s.count(start)==1,(filename,s.count(start))
            before,body=s.split(start,1);inner,after=body.split(end,1)
            quote='"' if filename.endswith('expanded-component-preview.tsx') else '\\"'
            wrapper='<div className='+quote+'p-2'+quote+'>'
            p.write_text(before+start+wrapper+inner+'</div>'+end+after)
          p=Path('docs/visual-reference.md')
          p.write_text(p.read_text()+'\nCarousel examples leave an 8px flat gutter around each raised face inside the existing masked viewport. The viewport still hides adjacent slides; no global overflow override is used. Live previews and all four copied examples share this structure. The English compilation fixture is derived from the displayed source. Navigation and four-edge clearance are checked after real Embla snaps in all four screen/mode projects and locales.\n')
          PY
          cd registry
          node --experimental-strip-types --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import ts from '@typescript/typescript6';
          import { componentDocs } from '../docs/components/docs/component-docs-data.ts';
          const filename='../docs/i18n/component-usage-code.en.ts';
          const ast=ts.createSourceFile(filename,fs.readFileSync(filename,'utf8'),ts.ScriptTarget.Latest,true);
          const declaration=ast.statements.filter(ts.isVariableStatement).flatMap(s=>[...s.declarationList.declarations]).find(d=>d.name.getText(ast)==='componentUsageCodeEn');
          assert.ok(declaration && ts.isCallExpression(declaration.initializer));
          const usage=new Map(declaration.initializer.arguments[0].properties.map(p=>[p.name.text,p.initializer.text]));
          const doc=componentDocs.find(d=>d.slug==='carousel');
          assert.ok(doc && usage.get('carousel'));
          fs.writeFileSync('tests/examples/carousel.tsx',`${doc.importCode}\n${usage.get('carousel')}\n`);
          JS
      - name: Add permanent geometry and interaction regression checks
        run: |
          cat > docs/tests/detail/carousel-layout.spec.ts <<'TS'
          import { expect, test, type Locator } from "@playwright/test";

          const labels = {
            en: ["Dashboard", "Settings", "Analytics"],
            ko: ["대시보드", "설정", "분석"],
            ja: ["ダッシュボード", "設定", "分析"],
            zh: ["仪表盘", "设置", "分析"],
          } as const;

          for (const [locale, titles] of Object.entries(labels)) {
            test(`carousel shadow clearance and navigation: ${locale}`, async ({ page }, info) => {
              const errors: string[] = [];
              page.on("pageerror", error => errors.push(error.message));
              const response = await page.goto(`/${locale}/components/carousel`);
              expect(response?.status()).toBe(200);
              await page.evaluate(() => document.fonts.ready);
              const carousel = page.locator('.component-example-panel [data-slot="carousel"]');
              const viewport = carousel.locator('[data-slot="carousel-content"]');
              const next = carousel.locator('[data-slot="carousel-next"]');
              const previous = carousel.locator('[data-slot="carousel-previous"]');
              await expect(next).toBeEnabled();
              await carousel.scrollIntoViewIfNeeded();
              await expect(viewport).toHaveCSS("overflow-x", "hidden");

              async function expectPlate(index: number) {
                const plate: Locator = carousel.locator('[data-slot="carousel-item"]').nth(index).locator("div").last();
                await expect(plate).toHaveText(titles[index]);
                expect(await plate.evaluate(e => getComputedStyle(e).boxShadow)).not.toBe("none");
                // Wait for the actual Embla snap. The viewport must still mask inactive slides.
                await expect.poll(async () => {
                  const host = (await viewport.boundingBox())!;
                  const face = (await plate.boundingBox())!;
                  return Math.min(face.x - host.x, face.y - host.y,
                    host.x + host.width - face.x - face.width,
                    host.y + host.height - face.y - face.height);
                }).toBeGreaterThanOrEqual(7.5);
                expect(await page.evaluate(() => document.documentElement.scrollWidth))
                  .toBeLessThanOrEqual(page.viewportSize()!.width + 1);
              }

              await expect(previous).toBeDisabled();
              await expectPlate(0);
              await carousel.screenshot({ path: info.outputPath("carousel-first.png"), animations: "disabled" });
              await next.click();
              await expect(previous).toBeEnabled();
              await expectPlate(1);
              await next.focus();
              await page.keyboard.press("ArrowRight");
              await expect(next).toBeDisabled();
              await expectPlate(2);
              await carousel.screenshot({ path: info.outputPath("carousel-last.png"), animations: "disabled" });
              await previous.focus();
              await page.keyboard.press("ArrowLeft");
              await expectPlate(1);
              await previous.click();
              await expect(previous).toBeDisabled();
              await expectPlate(0);
              expect(errors).toEqual([]);
            });
          }
          TS
      - name: Verify synchronized examples and documentation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
      - name: Inspect all locales and both screen sizes and themes
        working-directory: docs
        run: npx playwright test --config=playwright.detail.config.ts --grep 'carousel shadow clearance|catalog detail: carousel$' --output=test-results/docs-browser/carousel-after
      - name: Prepare the tested tree without moving main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          workflow='.github/workflows/carousel-composition-review.yml'
          Path(workflow).unlink()
          allowed={workflow,'docs/components/docs/expanded-component-preview.tsx','docs/components/docs/component-docs-data.ts','docs/i18n/component-usage-code.en.ts','docs/i18n/component-usage-code.ja.ts','docs/i18n/component-usage-code.zh.ts','registry/tests/examples/carousel.tsx','docs/tests/detail/carousel-layout.spec.ts','docs/visual-reference.md'}
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          changed=set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())
          assert changed==allowed,(changed,allowed)
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip()
          entries=[]
          for filename in sorted(changed):
            entry={'path':filename,'mode':'100644','type':'blob'}
            if Path(filename).exists(): entry['content']=Path(filename).read_text()
            else: entry['sha']=None
            entries.append(entry)
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',data=json.dumps({'base_tree':base,'tree':entries}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request) as response: created=json.load(response)
          Path('/tmp/carousel-review/tested-tree.json').write_text(json.dumps({'parent':os.environ['GITHUB_SHA'],'tree':created['sha'],'files':sorted(changed)},indent=2))
          Path('/tmp/carousel-review/changes.diff').write_bytes(subprocess.check_output(['git','diff','HEAD']))
          PY
      - name: Preserve actual before and after screenshots and reports
        if: always()
        run: |
          cp -R docs/test-results /tmp/carousel-review/ || true
          tar -czf /tmp/carousel-review/review-source.tar.gz docs/components/docs/expanded-component-preview.tsx docs/components/docs/component-docs-data.ts docs/i18n/component-usage-code.*.ts registry/tests/examples/carousel.tsx docs/tests/detail/carousel-layout.spec.ts docs/visual-reference.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: carousel-composition-review
          path: /tmp/carousel-review
          retention-days: 7
          if-no-files-found: error
