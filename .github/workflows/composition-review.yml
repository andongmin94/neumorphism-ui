name: Composition finish review
on:
  push:
    branches: [main]
    paths: [.github/workflows/composition-review.yml]
permissions:
  contents: write
concurrency:
  group: composition-finish-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Restore exact specimens and check supported action sizes
        run: |
          for revision in 314f4cda75153672219af8e24db77acf38dd388c 48b145afbebd1d4e8cb84f88f0a1c4257a27672f e395ae572ef0d8cc7d4bb3e1fa2d1c4b9e240db5 4b61a256f192fa28ff5fbd5c32c7a3b5ffaaba0f 880f6d303a7f7b71f52d4b683cd9bea0b14b06b6; do git fetch --depth=1 origin "$revision"; done
          python3 - <<'PY'
          import re, subprocess, textwrap
          from pathlib import Path
          text=subprocess.check_output(['git','show','880f6d303a7f7b71f52d4b683cd9bea0b14b06b6:.github/workflows/composition-review.yml'],text=True)
          blocks=re.findall(r"          python3 - <<'PY'\n(.*?)\n          PY",text,re.S)
          assert len(blocks)==2
          exec(compile(textwrap.dedent(blocks[0]),'<exact specimen>','exec'))
          Path('/tmp/composition-typography.py').write_text(textwrap.dedent(blocks[1]))
          p=Path('docs/tests/material/composition.tsx');s=p.read_text()
          target='function OverlayComposition() {'
          s=s.replace(target,target+'''\n  const sizeQuery = new URLSearchParams(location.search).get("actionSize");
            const actionSize = sizeQuery === "sm" || sizeQuery === "lg" ? sizeQuery : "default";
            const shortActions = sizeQuery !== null;''')
          s=s.replace('<Button variant="soft">Continue editing the existing workspace settings</Button>', '<Button size={actionSize} variant="soft">{shortActions ? "Cancel" : "Continue editing the existing workspace settings"}</Button>')
          s=s.replace('<DialogClose render={<Button variant="primary" />}>Save and return to workspace overview</DialogClose>', '<DialogClose render={<Button size={actionSize} variant="primary" />}>{shortActions ? "Save" : "Save and return to workspace overview"}</DialogClose>')
          s=s.replace('<AlertDialogCancel>Keep this workspace and continue editing</AlertDialogCancel>', '<AlertDialogCancel render={<Button size={actionSize} />}>{shortActions ? "Keep" : "Keep this workspace and continue editing"}</AlertDialogCancel>')
          s=s.replace('<AlertDialogAction>Remove the workspace from this local example</AlertDialogAction>', '<AlertDialogAction render={<Button size={actionSize} variant="destructive" />}>{shortActions ? "Remove" : "Remove the workspace from this local example"}</AlertDialogAction>')
          p.write_text(s)
          p=Path('docs/tests/material/composition.spec.ts');s=p.read_text()
          marker='    test("input gutters and baselines agree in a real form"'
          assert s.count(marker)==1
          test='''    test("modal action wrapping preserves small, default and large button sizes", async ({ page }) => {
                for (const [size, height] of [["sm", 32], ["default", 40], ["lg", 48]] as const) {
                  await page.goto(`/?composition=1&mode=${mode}&actionSize=${size}`);
                  await page.getByRole("button", { name: "Open composition", exact: true }).click();
                  const dialog = page.getByRole("dialog").filter({ has: page.getByRole("textbox", { name: "Dialog name", exact: true }) });
                  const footer = dialog.locator('[data-slot="dialog-footer"]');
                  for (const button of await footer.getByRole("button").all()) expect((await button.boundingBox())!.height).toBe(height);
                  await footer.getByRole("button", { name: "Save", exact: true }).click();
                  await page.getByRole("button", { name: "Confirm removal", exact: true }).click();
                  const alert = page.getByRole("alertdialog");
                  for (const button of await alert.locator('[data-slot="alert-dialog-footer"]').getByRole("button").all()) expect((await button.boundingBox())!.height).toBe(height);
                  await alert.getByRole("button", { name: "Keep", exact: true }).click();
                }
              });
          '''
          p.write_text(s.replace(marker,test+marker))
          PY
      - name: Compile fixture and install browser
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm run typecheck --prefix docs
          cd docs && npx playwright install --with-deps chromium
      - name: Record bounded unmodified-source failures
        working-directory: docs
        run: |
          mkdir -p test-results/composition-review
          set +e
          MATERIAL_PHASE=before npx playwright test --config=playwright.material.config.ts composition.spec.ts --max-failures=5 2>&1 | tee test-results/composition-review/before.log
          result=${PIPESTATUS[0]}
          set -e
          echo "$result" > test-results/composition-review/before-exit.txt
          cp test-results/material-report.json test-results/composition-review/before.json
      - name: Apply source-owned corrections
        run: |
          python3 /tmp/composition-1.py
          python3 /tmp/composition-extra.py
          python3 /tmp/composition-typography.py
          python3 - <<'PY'
          from pathlib import Path
          for name in ['dialog','alert-dialog']:
              p=Path(f'registry/src/components/ui/{name}.tsx');s=p.read_text()
              target='[&>button]:min-h-10'
              assert s.count(target)==1
              sizes='[&>button[data-size=sm]]:min-h-8 [&>button[data-size=sm]]:py-1 [&>button[data-size=lg]]:min-h-12 [&>button[data-size=icon]]:py-0'
              p.write_text(s.replace(target,target+' '+sizes))
          p=Path('docs/visual-reference.md')
          p.write_text(p.read_text()+'''\nDialog and Alert Dialog footer actions grow for multiline labels without replacing the supported small/default/large minimum heights (32/40/48px). The same source-only tests exercise each real Button size in both modal footers.\n''')
          PY
      - name: Static checks and generated-source equality
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          npm run check:generated --prefix registry
      - name: Check corrected compositions and existing material
        working-directory: docs
        run: |
          MATERIAL_PHASE=after npx playwright test --config=playwright.material.config.ts --max-failures=4 2>&1 | tee test-results/composition-review/after.log
          cp test-results/material-report.json test-results/composition-review/after.json
          node -e "const r=require('./test-results/material-report.json'); if(r.stats.unexpected || r.stats.skipped || r.stats.flaky) process.exit(1)"
      - name: Recheck every catalog and template surface
        working-directory: docs
        run: npx playwright test --config=playwright.detail.config.ts
      - name: Prepare exact reviewed tree without moving main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/composition-review.yml
          git add registry docs .github/workflows/composition-review.yml
          mkdir -p /tmp/composition-evidence
          git diff --cached --binary > /tmp/composition-evidence/reviewed.patch
          git diff --cached --stat > /tmp/composition-evidence/change-stat.txt
          python3 /tmp/composition-2.py
      - name: Preserve diagnostics and actual screenshots
        if: always()
        run: |
          mkdir -p /tmp/composition-evidence
          cp -r docs/test-results /tmp/composition-evidence/ || true
          git diff --binary > /tmp/composition-evidence/working.patch
          cp docs/tests/material/composition* /tmp/composition-evidence/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: composition-finish-review
          path: /tmp/composition-evidence
          retention-days: 7
          if-no-files-found: error
