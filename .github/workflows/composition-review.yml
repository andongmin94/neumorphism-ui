name: Composition review
on:
  push:
    branches: [main]
    paths: [.github/workflows/composition-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve the exact source for offline editing
        run: |
          mkdir -p "$RUNNER_TEMP/composition-review"
          git archive HEAD --format=tar -o "$RUNNER_TEMP/composition-review/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/composition-review/commit.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: composition-review-source
          path: ${{ runner.temp }}/composition-review
          retention-days: 7
          if-no-files-found: error
