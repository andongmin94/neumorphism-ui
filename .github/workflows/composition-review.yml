name: Composition finish review
on:
  push:
    branches: [main]
    paths: [.github/workflows/composition-review.yml]
permissions:
  contents: write
concurrency:
  group: composition-finish-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Restore exact review scripts and add bounded diagnostics
        run: |
          git fetch --depth=1 origin 314f4cda75153672219af8e24db77acf38dd388c
          python3 - <<'PY'
          import re, subprocess, textwrap
          from pathlib import Path
          text=subprocess.check_output(['git','show','314f4cda75153672219af8e24db77acf38dd388c:.github/workflows/composition-review.yml'],text=True)
          blocks=re.findall(r"          python3 - <<'PY'\n(.*?)\n          PY",text,re.S)
          assert len(blocks)==3, len(blocks)
          for n,block in enumerate(blocks): Path(f'/tmp/composition-{n}.py').write_text(textwrap.dedent(block))
          exec(compile(Path('/tmp/composition-0.py').read_text(),'/tmp/composition-0.py','exec'))
          p=Path('docs/tests/material/composition.tsx');s=p.read_text()
          target='Save and return to workspace overview</DialogClose></DialogFooter>'
          assert s.count(target)==1
          p.write_text(s.replace(target,target+'</DialogContent>'))
          p=Path('docs/tests/material/composition.spec.ts');s=p.read_text()
          s=s.replace('const phase =', 'test.setTimeout(15000);\nconst phase =')
          s=s.replace('const before = (await plan.boundingBox())!;', 'const before = (await plan.boundingBox())!; const originalScroll = await page.evaluate(() => scrollY);')
          s=s.replace('Math.abs((await plan.boundingBox())!.y - before.y)', 'Math.abs((await plan.boundingBox())!.y + await page.evaluate(() => scrollY) - before.y - originalScroll)')
          s=s.replace('and keep paste behavior', 'and preserve value entry')
          s=s.replace('await page.evaluate(() => document.fonts.ready); });', 'await page.evaluate(() => document.fonts.ready); await expect(page.getByRole("heading", { name: "Details that survive composition." })).toBeVisible({ timeout: 3000 }); });')
          p.write_text(s)
          PY
      - name: Compile the fixture before browser probing
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm run typecheck --prefix docs
          cd docs && npx playwright install --with-deps chromium
      - name: Record a bounded unmodified-source probe
        working-directory: docs
        run: |
          mkdir -p test-results/composition-review
          set +e
          MATERIAL_PHASE=before npx playwright test --config=playwright.material.config.ts composition.spec.ts --max-failures=4 --timeout=10000 2>&1 | tee test-results/composition-review/before.log
          result=${PIPESTATUS[0]}
          set -e
          echo "$result" > test-results/composition-review/before-exit.txt
          cp test-results/material-report.json test-results/composition-review/before.json
      - name: Apply source-owned fixes and check every source layer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 /tmp/composition-1.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/components/docs/navigation-preview.tsx');s=p.read_text()
          s=s.replace('import type { Locale }', 'import { useLocale } from "@/i18n/locale-provider";\nimport type { Locale }')
          s=s.replace('const t = copy[locale]; const id = React.useId();', 'const t = copy[locale]; const id = React.useId();\n  const { componentDocGroups } = useLocale();\n  const componentCount = componentDocGroups.reduce((total, group) => total + group.items.length, 0);')
          assert '{t.components} · 46' in s
          p.write_text(s.replace('{t.components} · 46', '{t.components} · {componentCount}'))
          PY
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          npm run check:generated --prefix registry
      - name: Check corrected composition and existing material
        working-directory: docs
        run: |
          MATERIAL_PHASE=after npx playwright test --config=playwright.material.config.ts --max-failures=4 2>&1 | tee test-results/composition-review/after.log
          cp test-results/material-report.json test-results/composition-review/after.json
      - name: Recheck all catalog and template surfaces
        working-directory: docs
        run: npx playwright test --config=playwright.detail.config.ts
      - name: Prepare exact tested tree without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/composition-review.yml
          git add registry docs .github/workflows/composition-review.yml
          mkdir -p /tmp/composition-evidence
          git diff --cached --binary > /tmp/composition-evidence/reviewed.patch
          git diff --cached --stat > /tmp/composition-evidence/change-stat.txt
          python3 /tmp/composition-2.py
      - name: Preserve diagnostics and actual screenshots
        if: always()
        run: |
          mkdir -p /tmp/composition-evidence
          cp -r docs/test-results /tmp/composition-evidence/ || true
          git diff --binary > /tmp/composition-evidence/working.patch
          cp docs/tests/material/composition* /tmp/composition-evidence/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: composition-finish-review
          path: /tmp/composition-evidence
          retention-days: 7
          if-no-files-found: error
