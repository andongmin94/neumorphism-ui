name: Composition finish review
on:
  push:
    branches: [main]
    paths: [.github/workflows/composition-review.yml]
permissions:
  contents: write
concurrency:
  group: composition-finish-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Restore exact reviewed specimens and add inherited typography coverage
        run: |
          for revision in 314f4cda75153672219af8e24db77acf38dd388c 48b145afbebd1d4e8cb84f88f0a1c4257a27672f e395ae572ef0d8cc7d4bb3e1fa2d1c4b9e240db5 4b61a256f192fa28ff5fbd5c32c7a3b5ffaaba0f; do git fetch --depth=1 origin "$revision"; done
          python3 - <<'PY'
          import re, subprocess, textwrap
          from pathlib import Path
          text=subprocess.check_output(['git','show','4b61a256f192fa28ff5fbd5c32c7a3b5ffaaba0f:.github/workflows/composition-review.yml'],text=True)
          block=re.findall(r"          python3 - <<'PY'\n(.*?)\n          PY",text,re.S)[0]
          exec(compile(textwrap.dedent(block),'<exact specimen>','exec'))
          p=Path('docs/tests/material/composition.tsx');s=p.read_text()
          s=s.replace('import { Input }', 'import { Textarea } from "@/components/ui/textarea";\nimport { Input }')
          s=s.replace('InputGroupAddon, InputGroupButton }','InputGroupAddon, InputGroupButton, InputGroupTextarea }')
          marker='<Field><FieldLabel>Read-only identifier</FieldLabel>'
          assert s.count(marker)==1
          pair='''<label className="grid min-w-0 gap-2 text-sm font-semibold">Plain notes<Textarea aria-label="Plain notes" defaultValue="Input content keeps its own weight." /></label>
                            <label className="grid min-w-0 gap-2 text-sm font-semibold">Compound notes<InputGroup><InputGroupTextarea aria-label="Compound notes" defaultValue="Input content keeps its own weight." /></InputGroup></label>
                            '''
          p.write_text(s.replace(marker,pair+marker))
          p=Path('docs/tests/material/composition.spec.ts');s=p.read_text()
          marker='const a = await inset(plain), b = await inset(compound);'
          assert s.count(marker)==1
          checks='''
                await expect(compound).toHaveCSS("font-weight", "400");
                await expect(compound).toHaveCSS("letter-spacing", await plain.evaluate(e => getComputedStyle(e).letterSpacing));
                for (const name of ["Plain notes", "Compound notes"]) {
                  const notes = page.getByRole("textbox", { name, exact: true });
                  await expect(notes).toHaveCSS("font-weight", "400");
                  await expect(notes).toHaveCSS("line-height", "24px");
                }'''
          p.write_text(s.replace(marker,marker+checks))
          PY
      - name: Compile fixture and install browser
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm run typecheck --prefix docs
          cd docs && npx playwright install --with-deps chromium
      - name: Record bounded unmodified-source failures
        working-directory: docs
        run: |
          mkdir -p test-results/composition-review
          set +e
          MATERIAL_PHASE=before npx playwright test --config=playwright.material.config.ts composition.spec.ts --max-failures=5 2>&1 | tee test-results/composition-review/before.log
          result=${PIPESTATUS[0]}
          set -e
          echo "$result" > test-results/composition-review/before-exit.txt
          cp test-results/material-report.json test-results/composition-review/before.json
      - name: Apply source-owned corrections
        run: |
          python3 /tmp/composition-1.py
          python3 /tmp/composition-extra.py
          python3 - <<'PY'
          from pathlib import Path
          for name in ['input-group','textarea']:
              p=Path(f'registry/src/components/ui/{name}.tsx');s=p.read_text()
              assert 'text-sm font-normal' not in s
              p.write_text(s.replace('text-sm','text-sm font-normal tracking-normal'))
          p=Path('docs/visual-reference.md')
          p.write_text(p.read_text()+'''\nComposed Input Group values and both multiline fields declare normal input weight and tracking, so bold parent labels cannot restyle entered text. Nested Combobox tests preserve Base UI's Escape behavior: a selected closed field clears first, then the parent Popover dismisses; the surrounding Dialog retains unsaved edits and restores focus.\n''')
          PY
      - name: Static checks and generated-source equality
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          npm run check:generated --prefix registry
      - name: Check corrected compositions and existing material
        working-directory: docs
        run: |
          MATERIAL_PHASE=after npx playwright test --config=playwright.material.config.ts --max-failures=4 2>&1 | tee test-results/composition-review/after.log
          cp test-results/material-report.json test-results/composition-review/after.json
          node -e "const r=require('./test-results/material-report.json'); if(r.stats.unexpected || r.stats.skipped || r.stats.flaky) process.exit(1)"
      - name: Recheck every catalog and template surface
        working-directory: docs
        run: npx playwright test --config=playwright.detail.config.ts
      - name: Prepare exact reviewed tree without moving main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/composition-review.yml
          git add registry docs .github/workflows/composition-review.yml
          mkdir -p /tmp/composition-evidence
          git diff --cached --binary > /tmp/composition-evidence/reviewed.patch
          git diff --cached --stat > /tmp/composition-evidence/change-stat.txt
          python3 /tmp/composition-2.py
      - name: Preserve diagnostics and actual screenshots
        if: always()
        run: |
          mkdir -p /tmp/composition-evidence
          cp -r docs/test-results /tmp/composition-evidence/ || true
          git diff --binary > /tmp/composition-evidence/working.patch
          cp docs/tests/material/composition* /tmp/composition-evidence/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: composition-finish-review
          path: /tmp/composition-evidence
          retention-days: 7
          if-no-files-found: error
