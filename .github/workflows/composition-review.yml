name: Composition review
on:
  push:
    branches: [main]
    paths: [.github/workflows/composition-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Apply the exact authored patch, verifying transport and original files
        run: |
          mkdir -p "$RUNNER_TEMP/composition-review"
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, re, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'composition-review'
          response = json.loads(subprocess.check_output(['gh','api','repos/andongmin94/neumorphism-ui/contents/.github/workflows/composition-review.yml?ref=e6e46198eadec177e80bc6cc46ff3145da65a808'],text=True))
          staged = base64.b64decode(response['content']).decode()
          encoded = re.search(r'EDITS: (\S+)', staged).group(1)
          for old, new in [('FwuOp3HEolt','FwuOp3FHolt'), ('eXr6zuHvy/p','eXr6zuHzy/p'), ('cCSfHe+LK0sx','cCSfHe+HK0sx')]:
              assert encoded.count(old) == 1
              encoded = encoded.replace(old, new)
          assert hashlib.sha256(encoded.encode()).hexdigest() == '915acbe8b5056f4abab2e340609a36839369e2a74d94a1eb87fdcff14e445d78'
          payload = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(payload).hexdigest() == '129f36b6cb659c55a8325cda132cc5c3a4704d464d924d5b671444a61a0effb0'
          for item in json.loads(payload):
              p = Path(item['path'])
              assert p.parts[0] in ('docs', 'registry') and '..' not in p.parts
              assert '/public/r/' not in str(p) and p.name not in ('theme.css', 'registry.json')
              s = p.read_text() if p.exists() else ''
              assert hashlib.sha256(s.encode()).hexdigest() == item['sha256'], str(p)
              for start, end, content in reversed(item['edits']): s = s[:start] + content + s[end:]
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(s)
          # Destination headings use the same task-first copy treatment in all locales.
          values = {
            'docs/src/pages/components/index.tsx': {
              'ko': ('컴포넌트','컴포넌트를 검색하고 예제와 설치 코드를 확인하세요.'),
              'en': ('Components','Search components, try the examples and copy their installation commands.'),
              'ja': ('コンポーネント','コンポーネントを検索し、動作例とインストールコードを確認できます。'),
              'zh': ('组件','搜索组件、试用示例并复制安装命令。'),
            },
            'docs/src/pages/customize.tsx': {
              'ko': ('테마 설정','색상, 그림자, 모서리와 움직임을 조정하세요. 미리보기에 적용한 설정을 CSS로 복사할 수 있습니다.'),
              'en': ('Theme Studio','Adjust colors, shadows, corners and motion. Preview the settings on components and copy the CSS.'),
              'ja': ('テーマ設定','色、影、角の丸み、動きを調整します。コンポーネントで確認した設定をCSSとしてコピーできます。'),
              'zh': ('主题设置','调整颜色、阴影、圆角与动效。在组件中预览设置，然后复制 CSS。'),
            },
            'docs/src/pages/charts.tsx': {
              'ko': ('차트','매출, 전환율, 빌드 시간과 서비스 지연 시간을 비교하세요. 각 차트에서 원본 데이터 표도 확인할 수 있습니다.'),
              'en': ('Charts','Compare revenue, conversion, build times and service latency. Each chart includes its underlying data table.'),
              'ja': ('チャート','売上、転換率、ビルド時間、サービスの応答時間を比較できます。各チャートには元データの表も付いています。'),
              'zh': ('图表','比较收入、转化率、构建时间和服务延迟。每个图表均附有原始数据表。'),
            },
          }
          for path, locales in values.items():
              p = Path(path); s = p.read_text()
              for locale, (title, body) in locales.items():
                  pattern = rf'({locale}: \{{\n)    kicker: "[^"]*",\n    title: "[^"]*",\n    body: "[^"]*",'
                  s, n = re.subn(pattern, lambda m: m[1] + f'    title: "{title}",\n    body: "{body}",', s)
                  assert n == 1, (path, locale)
              for line in ['          <p className="directory-eyebrow">{copy.kicker}</p>\n','        <span>{copy.kicker}</span>\n','        <span>{page.kicker}</span>\n']:
                  s = s.replace(line, '')
              if path.endswith('charts.tsx'):
                  s = s.replace('          <span>PRODUCT ANALYTICS</span>\n','').replace('          <span>REGISTRY SOURCE</span>\n','')
              p.write_text(s)
          p = Path('docs/tests/browser/presentation.spec.ts'); s = p.read_text()
          for old, new, count in [('Soft by design. Clear in use.','Neumorphic UI for React',2),('Install only the interface parts you need.','Components',1),('Charts that do not hide the data.','Charts',1),('Tune tokens in a real interface, not in a spreadsheet.','Theme Studio',1)]:
              assert s.count(old) == count
              s = s.replace(old, new)
          p.write_text(s)
          p = Path('docs/tests/detail/task-composition.spec.ts'); s = p.read_text()
          headings = '''const headings = {
            en: ["Components", "Theme Studio", "Charts"],
            ko: ["컴포넌트", "테마 설정", "차트"],
            ja: ["コンポーネント", "テーマ設定", "チャート"],
            zh: ["组件", "主题设置", "图表"],
          };

          '''
          s = s.replace('async function fits(page: Page)', headings + 'async function fits(page: Page)')
          s += '''
          // Titles identify destinations; the interactive demos and source panels remain below.
          for (const [locale, titles] of Object.entries(headings)) {
            test(`section headers name their actual destination: ${locale}`, async ({ page }, info) => {
              for (const [index, path] of ["components", "customize", "charts"].entries()) {
                await page.goto(`/${locale}/${path}`);
                await page.evaluate(() => document.fonts.ready);
                await expect(page.getByRole("heading", { level: 1 })).toHaveText(titles[index]);
                await fits(page);
                await page.screenshot({ path: info.outputPath(`${path}-top.png`) });
              }
            });
          }
          '''
          p.write_text(s)
          p = Path('docs/visual-reference.md'); s = p.read_text().replace('The landing page identifies the React collection directly.', 'The landing page identifies the React collection directly. Components, Charts and\nTheme Studio use destination names rather than promotional sentences or comparisons.').replace('the chart gallery composition, and native device/assistive', 'the chart gallery beyond its heading, and native device/assistive'); p.write_text(s)
          PY
          git add -N docs/components/docs/template-page.module.css docs/tests/detail/task-composition.spec.ts
          git diff --check
          git diff > "$RUNNER_TEMP/composition-review/authored.patch"
      - name: Generate installable output and check source
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          npm run check:generated --prefix registry
      - name: Targeted task, source and interaction regression
        working-directory: docs
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.detail.config.ts task-composition.spec.ts workspace-plates.spec.ts docs-reading.spec.ts reference-plate.spec.ts
          cp test-results/detail-report.json "$RUNNER_TEMP/composition-review/targeted-report.json"
          npx playwright test tests/browser/presentation.spec.ts tests/browser/docs-polish.spec.ts tests/browser/workspaces.spec.ts
          cp test-results/docs-report.json "$RUNNER_TEMP/composition-review/interaction-report.json"
      - name: Capture the unchanged component collection and composed templates
        working-directory: docs
        run: |
          npx playwright test --config=playwright.detail.config.ts catalog.spec.ts surface-system.spec.ts
          cp test-results/detail-report.json "$RUNNER_TEMP/composition-review/catalog-report.json"
      - name: Prepare a source-derived candidate without moving main
        run: |
          rm .github/workflows/composition-review.yml
          git add -A
          git diff --cached --check
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'composition-review'
          changes = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          entries = []
          for name in changes:
              p = Path(name)
              entry = {'path': name, 'mode': '100644', 'type': 'blob'}
              if p.exists(): entry['content'] = p.read_text()
              else: entry['sha'] = None
              entries.append(entry)
          request = {'base_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(), 'tree': entries}
          payload = root / 'tree-request.json'
          payload.write_text(json.dumps(request))
          result = json.loads(subprocess.check_output(['gh','api','--method','POST','repos/andongmin94/neumorphism-ui/git/trees','--input',str(payload)],text=True))
          (root/'candidate.json').write_text(json.dumps({'tree': result['sha'], 'parent': os.environ['GITHUB_SHA'], 'run': os.environ['GITHUB_RUN_ID'], 'changes': changes},indent=2))
          (root/'source.patch').write_text(subprocess.check_output(['git','diff','--cached'],text=True))
          payload.unlink()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: composition-review-evidence
          path: |
            ${{ runner.temp }}/composition-review
            docs/test-results
          retention-days: 7
          if-no-files-found: error
