name: Micro finish audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/micro-finish-audit.yml]
permissions:
  contents: read
concurrency:
  group: micro-finish-audit
  cancel-in-progress: true
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Decode authored patches
        run: |
          python3 - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          patches = {
            'fixtures': '',
            'product': ''
          }
          # Correct transcription is checked by gzip CRC before git applies any patch.
          patches['fixtures'] = patches['fixtures'].replace('b3PGpX3i8592', 'b3PGp3i8592')
          patches['product'] = patches['product'].replace('FFfvhxZZqC', 'FFfvhxZqC').replace('UgadbZZte', 'UgadbZte').replace('pIO2WYTRj6', 'pIO2XRj6')
          for name, encoded in patches.items():
              target = Path(os.environ['RUNNER_TEMP']) / f'{name}.patch'
              target.write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
      - name: Prepare before fixtures without changing product source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git apply --check "$RUNNER_TEMP/fixtures.patch"
          git apply "$RUNNER_TEMP/fixtures.patch"
          npm ci --prefix registry
          npm ci --prefix docs
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm run build --prefix docs
          cd docs && npx playwright install --with-deps chromium
      - name: Capture before screenshots and record expected regression failures
        run: |
          mkdir -p docs/test-results/before
          cd docs
          baseline_material=0
          MATERIAL_PHASE=before npx playwright test --config=playwright.material.config.ts micro-completion.spec.ts --grep='micro completion dark (320|1440)' || baseline_material=$?
          cp test-results/material-report.json test-results/before/material-report.json
          baseline_docs=0
          npx playwright test --config=playwright.detail.config.ts micro-controls.spec.ts --project=mobile-dark --output=test-results/before/docs || baseline_docs=$?
          cp test-results/detail-report.json test-results/before/detail-report.json
          printf 'material=%s\ndocs=%s\n' "$baseline_material" "$baseline_docs" > test-results/before/exit-codes.txt
      - name: Apply authored fixes and regenerate all shipping outputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git apply --check "$RUNNER_TEMP/product.patch"
          git apply "$RUNNER_TEMP/product.patch"
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          git diff --check
      - name: Verify after behavior, dimensions and all MD cases
        run: |
          cd docs
          result=0
          MATERIAL_PHASE=after npx playwright test --config=playwright.material.config.ts micro-finish.spec.ts micro-completion.spec.ts || result=1
          cp test-results/material-report.json test-results/after-material-report.json
          npx playwright test --config=playwright.detail.config.ts micro-finish.spec.ts micro-controls.spec.ts || result=1
          cp test-results/detail-report.json test-results/after-detail-report.json
          exit "$result"
      - name: Retain exact tested changes for review
        if: always()
        run: |
          git add -N docs/tests/material/micro-completion.* docs/tests/detail/micro-controls.spec.ts || true
          git diff --binary > "$RUNNER_TEMP/tested-changes.patch"
          cp "$RUNNER_TEMP/fixtures.patch" "$RUNNER_TEMP/review-fixtures.patch"
          cp "$RUNNER_TEMP/product.patch" "$RUNNER_TEMP/review-product.patch"
      - name: Save before and after evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: micro-completion-review
          retention-days: 7
          if-no-files-found: error
          path: |
            docs/test-results
            ${{ runner.temp }}/tested-changes.patch
            ${{ runner.temp }}/review-fixtures.patch
            ${{ runner.temp }}/review-product.patch
