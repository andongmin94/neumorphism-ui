name: Micro finish audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/micro-finish-audit.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: micro-finish-audit
  cancel-in-progress: true
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Recover only the reviewed authored changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36433620132 --repo "$GITHUB_REPOSITORY" --name micro-completion-review --dir "$RUNNER_TEMP/review"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, subprocess
          root = Path(os.environ['RUNNER_TEMP']) / 'review'
          for name, digest in [('fixtures', '35983b6602ff0d0dbeb9a0d1326e71944f404094fbf1625982266ad91cd75a72'), ('product', '392f5fb884fa8b2e61f89c6be71d8886fee636a4a7075845fb7de53f654b84da')]:
              matches = list(root.rglob(f'review-{name}.patch'))
              assert len(matches) == 1, matches
              patch = matches[0]
              assert hashlib.sha256(patch.read_bytes()).hexdigest() == digest
              subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
              subprocess.run(['git', 'apply', str(patch)], check=True)
          PY
      - name: Regenerate and verify source contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          git diff --check
      - name: Browser engine
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Full catalog, templates, charts and composition evidence
        working-directory: docs
        run: |
          result=0
          npx playwright test tests/browser/presentation.spec.ts tests/browser/docs-polish.spec.ts || result=1
          npx playwright test --config=playwright.material.config.ts || result=1
          npx playwright test --config=playwright.detail.config.ts || result=1
          exit "$result"
      - name: Prepare exact clean tree without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run check:generated --prefix registry
          git rm .github/workflows/micro-finish-audit.yml
          git add -A
          git diff --cached --check
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = git('rev-parse', 'HEAD')
          assert base == os.environ['GITHUB_SHA']
          remote = git('ls-remote', 'origin', 'refs/heads/main').split()[0]
          assert remote == base, 'main moved; do not replace user changes'
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          entries = []
          for name in filter(None, paths):
              p = Path(name)
              if p.exists():
                  assert p.is_file() and not p.is_symlink(), name
                  mode = git('ls-files', '--stage', '--', name).split()[0]
                  entries.append({'path': name, 'mode': mode, 'type': 'blob', 'content': p.read_text()})
              else:
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
          assert any(e['path'] == '.github/workflows/micro-finish-audit.yml' and e.get('sha', 'present') is None for e in entries)
          temp = Path(os.environ['RUNNER_TEMP'])
          (temp / 'release-tree-input.json').write_text(json.dumps({'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries}))
          (temp / 'release-base.json').write_text(json.dumps({'base_commit': base, 'base_tree': git('rev-parse', 'HEAD^{tree}'), 'changed_paths': [e['path'] for e in entries], 'review_run': 36433620132}, indent=2))
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input "$RUNNER_TEMP/release-tree-input.json" > "$RUNNER_TEMP/release-tree-response.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          info = json.loads((temp / 'release-base.json').read_text())
          info['tree_sha'] = json.loads((temp / 'release-tree-response.json').read_text())['sha']
          info['audit_run'] = os.environ['GITHUB_RUN_ID']
          info['temporary_workflow_removed'] = True
          reports = {}
          for report in ['docs-report.json', 'material-report.json', 'detail-report.json']:
              reports[report] = json.loads((Path('docs/test-results') / report).read_text())['stats']
          info['reports'] = reports
          (temp / 'release-candidate.json').write_text(json.dumps(info, indent=2))
          print(json.dumps(info, indent=2))
          PY
          git diff --cached --binary > "$RUNNER_TEMP/release-candidate.patch"
      - name: Save release tree metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: micro-final-candidate
          retention-days: 7
          path: |
            ${{ runner.temp }}/release-candidate.json
            ${{ runner.temp }}/release-candidate.patch
          if-no-files-found: warn
      - name: Save full visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: micro-final-presentation
          retention-days: 7
          path: docs/test-results
          if-no-files-found: error
