name: Micro finish audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/micro-finish-audit.yml]
permissions:
  contents: read
concurrency:
  group: micro-finish-audit
  cancel-in-progress: true
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Save exact source for review
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/neumorphism-source.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: micro-audit-source
          retention-days: 3
          path: |
            ${{ runner.temp }}/source-sha.txt
            ${{ runner.temp }}/neumorphism-source.tar.gz
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Registry and docs checks before browser review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          git diff --exit-code
      - name: Browser engine
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Probe 320px in addition to existing micro cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/tests/material/micro-finish.spec.ts')
          text = p.read_text()
          before = 'const width of [390, 1440]'
          assert text.count(before) == 1
          p.write_text(text.replace(before, 'const width of [320, 390, 1440]'))
          PY
          cd docs
          result=0
          npx playwright test --config=playwright.material.config.ts micro-finish.spec.ts || result=1
          npx playwright test --config=playwright.detail.config.ts micro-finish.spec.ts || result=1
          exit "$result"
      - name: Save narrow-screen evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: micro-audit-evidence
          retention-days: 7
          if-no-files-found: error
          path: docs/test-results
