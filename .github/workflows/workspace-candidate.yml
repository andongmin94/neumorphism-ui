name: Workspace implementation
on:
  push:
    branches: [main]
    paths: [.github/workflows/workspace-candidate.yml]
permissions:
  contents: write
concurrency:
  group: workspace-implementation
  cancel-in-progress: true
jobs:
  workspaces:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check candidate without changing the main product
        run: |
          git fetch --depth=1 origin 66521452d819ca1a1c837dd9d92742ee82cbadb2
          git checkout --detach 66521452d819ca1a1c837dd9d92742ee82cbadb2
          git checkout '${{ github.sha }}' -- .github/workflows/workspace-candidate.yml
      - run: npm ci --prefix registry && npm ci --prefix docs
      - name: Integrate catalog and localized documentation
        run: |
          node scripts/integrate-workspaces.mjs
          node scripts/refine-workspaces.mjs
      - name: Generate installation endpoints
        run: |
          npm run generate --prefix registry
          (cd registry && node node_modules/shadcn/dist/index.js build registry.json --output public/r)
          npm run sync:docs --prefix registry
      - name: Registry and model checks
        run: |
          npm run lint --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
      - name: Documentation build
        run: |
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          npm run test:ssr --prefix docs
      - name: Browser engines
        id: engines
        working-directory: docs
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Installed component and workspace interactions
        run: npm run consumer:verify --prefix registry
      - name: Localized documentation and templates
        if: ${{ !cancelled() && steps.engines.outcome == 'success' }}
        run: npm run test:browser --prefix docs
      - name: Publish verified implementation on main
        run: |
          npm run check:generated --prefix registry
          actual=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$actual" = '${{ github.sha }}' || { echo 'Main changed; refusing to overwrite concurrent work.'; exit 1; }
          git reset --soft '${{ github.sha }}'
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: ship navigation menus and two verified neumorphic workspaces'
          git push origin HEAD:main
          git rev-parse HEAD
      - name: Export implementation for inspection
        if: always()
        run: tar -czf "$RUNNER_TEMP/workspace-source.tar.gz" --exclude='*/node_modules' --exclude='docs/public/fonts' --exclude='docs/dist' --exclude='docs/.next' --exclude='docs/.wrangler' --exclude='docs/test-results' docs registry README.md QUALITY.md AGENTS.md .gitignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-source
          path: ${{ runner.temp }}/workspace-source.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-verification
          path: docs/test-results
          if-no-files-found: ignore
          retention-days: 7
