name: Materialize secondary-action finish (temporary)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-secondary-finish.yml
      - docs/tests/detail/raised-controls.spec.ts
      - docs/tests/material/material.spec.ts

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Install exact locked dependencies
        run: npm ci --prefix registry && npm ci --prefix docs
      - name: Generate from registry source and verify consumers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run typecheck --prefix docs
          npm run build --prefix docs
      - name: Commit generated manifests and document copies
        run: |
          git add -u registry docs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Source-derived registry and docs outputs are already synchronized."
          else
            git diff --cached --stat
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "build: synchronize tactile secondary registry and docs"
            git push origin HEAD:main
          fi
      - name: Install Chromium
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Installed source material states
        working-directory: docs
        run: npx playwright test --config=playwright.material.config.ts tests/material/material.spec.ts
      - name: Documentation controls desktop/mobile light/dark
        working-directory: docs
        run: npx playwright test --config=playwright.detail.config.ts tests/detail/raised-controls.spec.ts
      - name: Save actual rendered surfaces and state evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tactile-secondary-before-after-review
          retention-days: 7
          if-no-files-found: warn
          path: |
            docs/test-results/docs-browser/catalog/**/dialog-raised-footer.png
            docs/test-results/docs-browser/catalog/**/soft-button.png
            docs/test-results/docs-browser/catalog/**/*-raised.png
            docs/test-results/material-report.json
            docs/test-results/detail-report.json
