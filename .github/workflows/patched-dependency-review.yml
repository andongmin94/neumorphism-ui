name: Patched dependency review
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Update only in-range patched transitive locks
        run: |
          # npm audit fix is restricted to existing semver ranges; never use --force.
          # The braces advisory has no in-range fix, so audit exits nonzero.
          npm audit fix --prefix registry --package-lock-only --ignore-scripts --audit-level=high || true
          npm audit fix --prefix docs --package-lock-only --ignore-scripts --audit-level=high || true
          python3 - <<'PY'
          import json, pathlib, subprocess
          paths = subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert paths and set(paths) <= {'docs/package-lock.json', 'registry/package-lock.json'}, paths
          target = {'proxy-addr': (2,0,8), 'source-map-js': (1,2,2),
                    '@modelcontextprotocol/sdk': (1,31,0), 'postcss-selector-parser': (7,1,6)}
          for folder in ('registry','docs'):
            data = json.loads(pathlib.Path(folder,'package-lock.json').read_text())['packages']
            for package, minimum in target.items():
              copies = [(name, value['version']) for name,value in data.items()
                if name.endswith('/node_modules/'+package)]
              for name, version in copies:
                import re
                match = re.match(r'^(\d+)\.(\d+)\.(\d+)',version)
                assert match and tuple(map(int,match.groups())) >= minimum, (folder,name,version,minimum)
              print(folder,package,copies)
          PY
      - name: Install and verify current source against updated locks
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          git diff --check
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Capture honest audit results and candidate tree (do not publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/patched-review"
          npm audit --prefix registry --audit-level=high --json > "$RUNNER_TEMP/patched-review/registry-audit.json" || true
          npm audit --prefix docs --audit-level=high --json > "$RUNNER_TEMP/patched-review/docs-audit.json" || true
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          base = os.environ['GITHUB_SHA']; repo = os.environ['GITHUB_REPOSITORY']
          reg = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'patched-review','registry-audit.json').read_text())
          doc = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'patched-review','docs-audit.json').read_text())
          for name,data in [('registry',reg),('docs',doc)]:
            assert data.get('metadata',{}).get('vulnerabilities') is not None, (name,data)
            print(name,data['metadata']['vulnerabilities'])
          assert reg['metadata']['vulnerabilities']['critical']==0, 'registry critical audit remains'
          assert doc['metadata']['vulnerabilities']['critical']==0, 'docs critical audit remains'
          assert doc['metadata']['vulnerabilities']['high']==0, 'docs high audit remains'
          newFiles=['registry/package-lock.json','docs/package-lock.json']
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==set(newFiles), changed
          parent=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/commits/{base}']))
          changes=[dict(path=name,mode='100644',type='blob',content=pathlib.Path(name).read_text()) for name in newFiles]
          changes.append(dict(path='.github/workflows/patched-dependency-review.yml',mode='100644',type='blob',sha=None))
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'patched-review'
          request=output/'request.json'
          request.write_text(json.dumps(dict(base_tree=parent['tree']['sha'],tree=changes)))
          tree=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/trees','--input',str(request)]))
          request.unlink()
          (output/'candidate.json').write_text(json.dumps(dict(parent=base,tree=tree['sha'],changed=newFiles,
              registry=reg['metadata']['vulnerabilities'],docs=doc['metadata']['vulnerabilities']),indent=2))
          print((output/'candidate.json').read_text())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7
        if: always()
        with:
          name: patched-dependency-candidate
          path: ${{ runner.temp }}/patched-review
          retention-days: 3
          if-no-files-found: ignore
