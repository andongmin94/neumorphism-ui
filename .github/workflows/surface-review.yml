name: Full surface reference review
on:
  push:
    branches: [main]
    paths: [.github/workflows/surface-review.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-surface-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Collect exact source and built baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/surface-review
          git archive HEAD | tar -x -C /tmp/surface-review
          npm ci --prefix registry
          npm ci --prefix docs
          npm run build --prefix docs
          cp -R docs/dist /tmp/surface-review/built-baseline
          printf '%s\n' "$GITHUB_SHA" > /tmp/surface-review/baseline-sha.txt
      - name: Baseline review bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-surface-baseline
          path: /tmp/surface-review
          include-hidden-files: true
          retention-days: 3
