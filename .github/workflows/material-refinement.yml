name: Material refinement review
on:
  push:
    branches: [main]
    paths: ['.github/workflows/material-refinement.yml']
permissions:
  contents: write
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Recover exactly the tested source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36223603288 --repo "$GITHUB_REPOSITORY" --name material-refinement-review --dir "$RUNNER_TEMP/material-reviewed"
          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          patch = Path(os.environ['RUNNER_TEMP']) / 'material-reviewed/material-review/changes.patch'
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == 'c452f9356bf6c67a131daca358b52aa958dd0d464e6c1934cd4b4309713cfb73'
          PY
          git apply --index --exclude='.github/**' "$RUNNER_TEMP/material-reviewed/material-review/changes.patch"
      - name: Export product tree for GitHub MCP publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/test-results/material-export
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const repo = process.env.GITHUB_REPOSITORY;
          const parent = process.env.GITHUB_SHA;
          async function api(path, body) {
            const r = await fetch(`https://api.github.com/repos/${repo}/${path}`, {
              method: body ? 'POST' : 'GET',
              headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            if (!r.ok) throw new Error(`${path}: ${r.status} ${await r.text()}`);
            return r.json();
          }
          const paths = execFileSync('git', ['diff', '--cached', '--name-only'], { encoding: 'utf8' }).trim().split('\n');
          if (paths.some(p => p.startsWith('.github/'))) throw new Error('Workflow changes must be published through the authorized GitHub MCP connection.');
          const elements = paths.map(path => ({ path, mode: '100644', type: 'blob', content: fs.readFileSync(path, 'utf8') }));
          fs.writeFileSync('docs/test-results/material-export/sources.json', JSON.stringify(elements));
          const base = await api(`git/commits/${parent}`);
          const result = await api('git/trees', { base_tree: base.tree.sha, tree: elements });
          fs.writeFileSync('docs/test-results/material-export/candidate.json', JSON.stringify({ parent, tree: result.sha, files: paths, reviewedRun: 36223603288 }, null, 2));
          console.log(`Verified product tree: ${result.sha}. Main was NOT moved.`);
          JS
      - name: Save publication inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: material-publication-inputs
          path: docs/test-results/material-export
          retention-days: 7
          if-no-files-found: error
