name: Materialize analytics
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply staged analytics patch
        run: |
          test -f .github/analytics.patch.part-00
          cat .github/analytics.patch.part-* | base64 -d | gzip -dc > "$RUNNER_TEMP/analytics.patch"
          git apply --check "$RUNNER_TEMP/analytics.patch"
          git apply "$RUNNER_TEMP/analytics.patch"
          rm -f .github/analytics.patch.gz.b64 .github/analytics.patch.part-*
      - name: Align documentation source paths
        run: |
          node -e 'const fs=require("fs");const f="docs/tsconfig.json";const c=JSON.parse(fs.readFileSync(f,"utf8"));c.compilerOptions.paths["@/components/blocks/*"]=["../registry/src/components/blocks/*"];c.compilerOptions.paths["@/lib/analytics-model"]=["../registry/src/lib/analytics-model.ts"];c.compilerOptions.paths["@/lib/analytics-copy"]=["../registry/src/lib/analytics-copy.ts"];fs.writeFileSync(f,JSON.stringify(c,null,2)+"\n")'
          node -e 'const fs=require("fs");const f="docs/vite.config.ts";const s=fs.readFileSync(f,"utf8");const b="alias: { \"@/components/ui\": fileURLToPath(new URL(\"../registry/src/components/ui\", import.meta.url)) },";if(!s.includes(b))throw new Error("Expected docs Vite alias block not found");const a="alias: {\n        \"@/components/ui\": fileURLToPath(new URL(\"../registry/src/components/ui\", import.meta.url)),\n        \"@/components/blocks\": fileURLToPath(new URL(\"../registry/src/components/blocks\", import.meta.url)),\n        \"@/lib/analytics-model\": fileURLToPath(new URL(\"../registry/src/lib/analytics-model.ts\", import.meta.url)),\n        \"@/lib/analytics-copy\": fileURLToPath(new URL(\"../registry/src/lib/analytics-copy.ts\", import.meta.url)),\n      },";fs.writeFileSync(f,s.replace(b,a))'
      - name: Refresh dependency locks
        run: |
          npm install --package-lock-only --ignore-scripts --prefix registry
          npm install --package-lock-only --ignore-scripts --prefix docs
          npm ci --prefix registry
          npm ci --prefix docs
      - name: Generate registry outputs
        run: |
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
      - name: Verify documentation
        run: |
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          npm run test:ssr --prefix docs
      - name: Audit installable dependency graph
        run: npm audit --omit=dev --audit-level=high --prefix registry
      - name: Install browser engines
        working-directory: docs
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify installed applications
        run: npm run consumer:verify --prefix registry
      - name: Verify hydrated documentation
        working-directory: docs
        run: npm run test:browser
      - name: Source cleanliness
        run: |
          git diff --check
          npm run check:generated --prefix registry
      - name: Commit verified analytics implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add analytical charts and dashboard'
          git push origin HEAD:main
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-verification
          path: docs/test-results
          if-no-files-found: ignore
          retention-days: 7
