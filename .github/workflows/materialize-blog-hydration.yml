name: Synchronize hydrated Blog registry (temporary)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-blog-hydration.yml
permissions:
  contents: write
jobs:
  materialize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix registry && npm ci --prefix docs
      - name: Generate registry and synchronize docs
        run: |
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run typecheck --prefix docs
          npm run build --prefix docs
      - name: Commit source-derived outputs to main
        run: |
          git add -u registry docs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Expected Blog registry outputs to change" >&2
            exit 1
          fi
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "build: regenerate Blog hydration registry outputs"
          git push origin HEAD:main
      - name: Install Chromium
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Test delayed hydration on desktop and mobile
        working-directory: docs
        run: npx playwright test --config=playwright.detail.config.ts tests/detail/docs-hydration.spec.ts
      - name: Save hydration screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blog-first-input-hydration
          retention-days: 7
          if-no-files-found: warn
          path: |
            docs/test-results/docs-browser/catalog/**/blog-*.png
            docs/test-results/detail-report.json
            docs/test-results/docs-browser/catalog/**/trace.zip
