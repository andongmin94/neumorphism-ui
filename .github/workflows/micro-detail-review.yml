name: Micro detail review
on:
  push:
    branches: [main]
    paths: [.github/workflows/micro-detail-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Restore the immutable source review scripts
        run: |
          mkdir -p /tmp/micro-detail
          git fetch --depth=1 origin 3e67c06c79d10e00123ab6aa2c220afd5bf2ef3d
          python - <<'PY'
          import subprocess
          from pathlib import Path
          source=subprocess.check_output(['git','show','3e67c06c79d10e00123ab6aa2c220afd5bf2ef3d:.github/workflows/micro-detail-review.yml'],text=True)
          for name,title in {'apply':'Apply the reviewed source changes with exact preimage checks','validate':'Generate registry endpoints and validate source and documentation','tree':'Prepare the tested product tree without moving main','evidence':'Retain actual screenshots, reports and changed source'}.items():
            section=source.split('      - name: '+title+'\n',1)[1].split('\n      - ',1)[0]
            lines=section.split('        run: |\n',1)[1].splitlines()
            assert all(not line or line.startswith('          ') for line in lines)
            Path('/tmp/micro-detail/'+name+'.sh').write_text('\n'.join(line[10:] for line in lines)+'\n')
          PY
      - name: Apply the source patch and correct the new test expectations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash -e /tmp/micro-detail/apply.sh
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/tests/material/micro-finish.spec.ts');s=p.read_text()
          a='toHaveCSS("resize", "y")';assert s.count(a)==1;s=s.replace(a,'toHaveCSS("resize", "vertical")')
          a='      const close = page.getByRole("button", { name: "Dismiss notification" });';assert s.count(a)==1
          b='''      const toast = page.locator('[data-slot="toast"]');
                await expect(toast).toBeVisible();
                // Base UI excludes dismiss controls from live announcements until toast focus enters.
                await page.keyboard.press("F6");
                await toast.screenshot({ path: info.outputPath("toast-close.png") });
                const close = page.getByRole("button", { name: "Dismiss notification" });'''
          p.write_text(s.replace(a,b))
          PY
      - name: Generate and validate synchronized product source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash -e /tmp/micro-detail/validate.sh
      - name: Install the review browser
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Exercise source-only materials and all micro-design cases
        working-directory: docs
        run: |
          MATERIAL_PHASE=micro-finish npx playwright test --config=playwright.material.config.ts --max-failures=8
          cp test-results/material-report.json /tmp/micro-detail/material-report.json
      - name: Capture actual documentation examples in all locales and modes
        working-directory: docs
        run: |
          npx playwright test --config=playwright.detail.config.ts --grep 'micro finish docs|catalog detail: (pagination|marquee|resizable|image-card|breadcrumb|input-group|switch|toggle|sidebar|accordion|collapsible|data-table)$' --output=test-results/docs-browser/micro-after --max-failures=8
          cp test-results/detail-report.json /tmp/micro-detail/detail-report.json
      - name: Prepare the tested product tree without moving main
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -e /tmp/micro-detail/tree.sh
      - name: Retain actual screenshots, reports and changed source
        if: always()
        run: bash -e /tmp/micro-detail/evidence.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: micro-detail-review
          path: /tmp/micro-detail
          retention-days: 7
          if-no-files-found: error
