name: Docs chrome review
on:
  status:
permissions:
  contents: write
jobs:
  candidate:
    if: >-
      github.ref == 'refs/heads/main' && github.event.context == 'Vercel' &&
      github.event.state == 'success' && github.event.sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Dependencies and browser
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm install --prefix docs --save-exact pretendard-jp@1.3.9 @fontsource/noto-sans-sc
          cd docs && npx playwright install --with-deps chromium
      - name: Apply reviewed geometry and actual language fonts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/chrome-review"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          blob=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/c1d0aea549c504475a207bfeaef70d5aa123669d']))
          patch=lzma.decompress(base64.b64decode(blob['content']))
          assert hashlib.sha256(patch).hexdigest()=='f0087a50c52d086fecfaf64000ff904c8d5c3c7e04213ff06a118abaae0c2fd3'
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          p=pathlib.Path('docs/components/docs/language-switcher.tsx')
          t=p.read_text().replace('import styles from "./language-switcher.module.css";', 'import "pretendard-jp/dist/web/variable/pretendardvariable-jp-dynamic-subset.css";\nimport "@fontsource/noto-sans-sc/500.css";\nimport styles from "./language-switcher.module.css";')
          p.write_text(t)
          p=pathlib.Path('docs/components/docs/language-switcher.module.css')
          t=p.read_text().replace('.item:hover {', '/* Keep the primary UI face; provide real 500-weight glyphs for each native label. */\n.item[lang="ja"] {\n  font-family: "Pretendard JP Variable", var(--font-sans);\n}\n\n.item[lang="zh-CN"] {\n  font-family: "Noto Sans SC", var(--font-sans);\n}\n\n.item:hover {')
          p.write_text(t)
          p=pathlib.Path('docs/tests/detail/chrome-finish.spec.ts')
          t=p.read_text().replace('    const cdp = await page.context().newCDPSession(page);', '    await page.evaluate(() => document.fonts.ready);\n    const cdp = await page.context().newCDPSession(page);')
          t=t.replace('    await cdp.detach();', '    for (const labelFonts of fonts) {\n      expect(labelFonts.fonts.length).toBeGreaterThan(0);\n      expect(labelFonts.fonts.every(font => font.isCustomFont)).toBe(true);\n    }\n    await cdp.detach();')
          p.write_text(t)
          p=pathlib.Path('docs/src/pages/docs/credits.tsx')
          t=p.read_text().replace('  ["Pretendard", "Bundled UI font dependency"],', '  ["Pretendard", "Bundled UI font dependency"],\n  ["Pretendard JP", "Self-hosted Japanese language-menu labels (OFL-1.1)"],\n  ["Noto Sans SC / Fontsource", "Self-hosted Chinese language-menu labels, weight 500 (OFL-1.1)"],')
          p.write_text(t)
          p=pathlib.Path('docs/visual-reference.md')
          t=p.read_text().replace('Platform font diagnostics accompany screenshots; matching CSS weights alone is\nnot proof of identical script rendering. Installed registry source is unchanged.', 'The first capture exposed system CJK fonts despite equal CSS weights. Japanese\nmenu labels now use self-hosted Pretendard JP and Chinese labels self-hosted Noto\nSans SC at weight 500, scoped to this menu. Latin/Hangul UI remains Pretendard.\nThe Chromium regression verifies actual custom glyph fonts, not just CSS family\nnames. Font packages are exact locked, bundled by Vite and credited; no remote\nfont service or artificial bold is used. Installed registry source is unchanged.')
          p.write_text(t)
          pathlib.Path('.github/workflows/docs-chrome-review.yml').unlink()
          PY
      - name: Source contracts and documentation build
        run: |
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
      - name: Check the reported defects and adjacent behavior
        working-directory: docs
        run: npx playwright test --config=playwright.detail.config.ts chrome-finish.spec.ts document-rhythm.spec.ts language-label.spec.ts docs-reading.spec.ts surface-system.spec.ts
      - name: Prepare tested tree for visual review without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --check HEAD
          npm run check:generated --prefix registry
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          repo=os.environ['GITHUB_REPOSITORY'];parent=os.environ['GITHUB_SHA']
          base=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/commits/{parent}']))
          paths=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          paths+=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          entries=[]
          for name in sorted(set(paths)):
              p=pathlib.Path(name);entry=dict(path=name,mode='100644',type='blob')
              if p.exists():entry['content']=p.read_text()
              else:entry['sha']=None
              entries.append(entry)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'chrome-review'
          request=out/'request.json';request.write_text(json.dumps(dict(base_tree=base['tree']['sha'],tree=entries)))
          result=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/trees','--input',str(request)]));request.unlink()
          (out/'candidate.json').write_text(json.dumps(dict(parent=parent,tree=result['sha'],paths=sorted(set(paths))),indent=2))
          (out/'candidate-source.json').write_text(json.dumps({e['path']:e.get('content') for e in entries},ensure_ascii=False))
          (out/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','--binary','HEAD']))
          print(json.dumps(dict(parent=parent,tree=result['sha'],files=len(entries))))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: docs-chrome-candidate
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/chrome-review
            docs/test-results
