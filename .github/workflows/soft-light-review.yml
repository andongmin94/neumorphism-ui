name: Soft light candidate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Apply focused shadow token change, without updating main
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('registry/src/theme.ts')
          text=src.read_text()
          edits=[
           (
            '  const raisedSmallLight = `color-mix(in srgb, ${tokens.shadowLight} 84%, transparent)`;\n',
            '''  // Light mode: less chalky highlights on controls and plates.
  // Retain dark-mode geometry and inset shadows.
  const raisedSmallOffset = mode === "light" ? Math.max(1, profile.smallOffset - 1) : profile.smallOffset;
  const raisedDark = mode === "light" ? `color-mix(in srgb, ${tokens.shadowDark} 92%, transparent)` : tokens.shadowDark;
  const raisedLargeLight = `color-mix(in srgb, ${tokens.shadowLight} ${mode === "light" ? 74 : 94}%, transparent)`;
  const raisedSmallLight = `color-mix(in srgb, ${tokens.shadowLight} ${mode === "light" ? 64 : 84}%, transparent)`;
  const raisedPlateLight = `color-mix(in srgb, ${tokens.shadowLight} ${mode === "light" ? 68 : 84}%, transparent)`;
'''
           ),
           (
            'const plateShadow = `${x}px ${y * 2}px 3px -1px ${tokens.shadowDark}, ${x * (profile.smallOffset + 1)}px ${y * (profile.smallOffset + 1)}px ${profile.smallBlur + 3}px -2px ${tokens.shadowDark}, ${-x * profile.smallOffset}px ${-y * profile.smallOffset}px ${profile.smallBlur}px -1px ${raisedSmallLight}`;',
            'const plateShadow = `${x}px ${y * 2}px 3px -1px ${raisedDark}, ${x * (profile.smallOffset + 1)}px ${y * (profile.smallOffset + 1)}px ${profile.smallBlur + 3}px -2px ${raisedDark}, ${-x * profile.smallOffset}px ${-y * profile.smallOffset}px ${profile.smallBlur}px -1px ${raisedPlateLight}`;'
           ),
           (
            'const primaryShadow = `${x * profile.smallOffset}px ${y * (profile.smallOffset + 1)}px ${profile.smallBlur + 1}px ${tokens.shadowDark}, ${-x * profile.smallOffset}px ${-y * profile.smallOffset}px ${profile.smallBlur}px ${raisedSmallLight}, inset ${x}px ${y}px 2px color-mix(in srgb, ${primary} 94%, white)`;',
            'const primaryShadow = `${x * raisedSmallOffset}px ${y * (raisedSmallOffset + 1)}px ${profile.smallBlur + 1}px ${raisedDark}, ${-x * raisedSmallOffset}px ${-y * raisedSmallOffset}px ${profile.smallBlur}px ${raisedSmallLight}, inset ${x}px ${y}px 2px color-mix(in srgb, ${primary} 94%, white)`;'
           ),
           (
            '      tokens.shadowDark,\n      `color-mix(in srgb, ${tokens.shadowLight} 94%, transparent)`,\n',
            '      raisedDark,\n      raisedLargeLight,\n'
           ),
           (
            '      profile.smallOffset,\n      profile.smallBlur,\n      tokens.shadowDark,\n      raisedSmallLight,\n',
            '      raisedSmallOffset,\n      profile.smallBlur,\n      raisedDark,\n      raisedSmallLight,\n'
           ),
           (
            '    "--neu-shadow-primary-hover": shadowValue(x, y, profile.smallOffset + 1, profile.smallBlur + 3, tokens.shadowDark, raisedSmallLight)',
            '    "--neu-shadow-primary-hover": shadowValue(x, y, raisedSmallOffset + 1, profile.smallBlur + 3, raisedDark, raisedSmallLight)'
           ),
           (
            '    "--neu-shadow-hover": shadowValue(x, y, profile.smallOffset + 1, profile.smallBlur + 3, tokens.shadowDark, raisedSmallLight),',
            '    "--neu-shadow-hover": shadowValue(x, y, raisedSmallOffset + 1, profile.smallBlur + 3, raisedDark, raisedSmallLight),'
           ),
          ]
          for before,after in edits:
            assert text.count(before)==1, ('source moved',before)
            text=text.replace(before,after)
          src.write_text(text)
          tests=Path('registry/tests/material-tokens.test.mjs')
          tests.write_text(tests.read_text()+'''
test("light raised highlights are softer without changing dark or inset material", () => {
  for (const preset of themePresetIds) {
    const settings = { ...defaultThemeSettings, ...getThemePreset(preset).defaults, presetId: preset };
    for (const mode of ["light", "dark"]) {
      const tokens = buildThemeVariables(settings, mode);
      const expected = mode === "light" ? { small: 64, plate: 68, large: 74 } : { small: 84, plate: 84, large: 94 };
      assert.ok(tokens["--neu-shadow-raised-sm"].includes(`${expected.small}%, transparent`));
      assert.ok(tokens["--neu-shadow-plate"].includes(`${expected.plate}%, transparent`));
      assert.ok(tokens["--neu-shadow-raised"].includes(`${expected.large}%, transparent`));
      assert.ok(tokens["--neu-shadow-hover"].includes(`${expected.small}%, transparent`));
      assert.ok(tokens["--neu-shadow-primary"].includes(`${expected.small}%, transparent`));
      assert.match(tokens["--neu-shadow-inset"], /inset/);
      assert.match(tokens["--neu-shadow-inset-sm"], /inset/);
      assert.doesNotMatch(tokens["--neu-shadow-plate"], /inset/);
    }
  }
});
''')
          test=Path('docs/tests/detail/light-refinement.spec.ts')
          test.write_text('''import { expect, test } from "@playwright/test";

for (const mode of ["light", "dark"] as const) {
  test(`raised controls and plates retain clear material with quieter light: ${mode}`, async ({ page }, info) => {
    await page.goto("/en/components/button");
    await page.evaluate(() => document.fonts.ready);
    const button = page.locator(".component-example-panel [data-slot=button][data-variant=default]").first();
    await expect(button).toBeVisible();
    const values = await page.evaluate(() => {
      const style = getComputedStyle(document.documentElement);
      return Object.fromEntries(["--neu-shadow-raised", "--neu-shadow-raised-sm", "--neu-shadow-hover",
        "--neu-shadow-plate", "--neu-shadow-inset"].map(key => [key, style.getPropertyValue(key).trim()]));
    });
    const light = mode === "light";
    for (const [key, mix] of [["--neu-shadow-raised", light ? "74%" : "94%"],
      ["--neu-shadow-raised-sm", light ? "64%" : "84%"],
      ["--neu-shadow-hover", light ? "64%" : "84%"],
      ["--neu-shadow-plate", light ? "68%" : "84%"]] as const) {
      expect(values[key]).toContain(mix);
    }
    await expect(button).not.toHaveCSS("box-shadow", "none");
    expect(await button.evaluate(el => getComputedStyle(el).boxShadow)).not.toContain("inset");
    await button.screenshot({ path: info.outputPath("button.png"), animations: "disabled" });
    await button.focus();
    await expect(button).toHaveCSS("outline-width", "2px");
    await page.locator(".component-installation").screenshot({ path: info.outputPath("copy-and-registry.png"), animations: "disabled" });

    await page.goto("/en/components/card");
    const card = page.locator(".component-example-panel [data-slot=card][data-variant=raised]").first();
    await expect(card).toBeVisible();
    const shadow = await card.evaluate(el => getComputedStyle(el).boxShadow);
    expect(shadow).not.toBe("none");
    expect(shadow).not.toContain("inset");
    await card.screenshot({ path: info.outputPath("card.png"), animations: "disabled" });
    expect(await page.evaluate(() => document.documentElement.scrollWidth - innerWidth)).toBeLessThanOrEqual(1);
  });
}
''')
          cfg=Path('docs/playwright.published.config.ts')
          c=cfg.read_text()
          needle='"**/detail/audit-polish.spec.ts", '
          assert c.count(needle)==1
          cfg.write_text(c.replace(needle, '"**/detail/light-refinement.spec.ts", '+needle))
          PY
      - name: Validate source and generate genuine registry outputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          git diff --check
      - name: Capture true browser surfaces
        working-directory: docs
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.detail.config.ts light-refinement.spec.ts
      - name: Create candidate Git tree from generated files; never update main here
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, pathlib, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          parent=os.environ['GITHUB_SHA']
          commit=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/commits/{parent}']))
          changed=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          assert changed, 'no source modification'
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          paths+=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'soft-light-candidate'
          base.mkdir(exist_ok=True)
          files=[]
          for name in sorted(set(paths)):
            if name.startswith('docs/test-results/'): continue
            p=pathlib.Path(name)
            if p.exists():
              files.append(dict(path=name,mode='100644',type='blob',content=p.read_text()))
            else:
              files.append(dict(path=name,mode='100644',type='blob',sha=None))
          files.append(dict(path='.github/workflows/soft-light-review.yml',mode='100644',type='blob',sha=None))
          req=base/'request.json'
          req.write_text(json.dumps(dict(base_tree=commit['tree']['sha'],tree=files)))
          tree=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/trees','--input',str(req)]))
          req.unlink()
          (base/'candidate.json').write_text(json.dumps(dict(parent=parent,tree=tree['sha'],paths=sorted(set(paths))),indent=2))
          (base/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','--binary']))
          print((base/'candidate.json').read_text())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: soft-light-candidate
          path: |
            ${{ runner.temp }}/soft-light-candidate
            docs/test-results/docs-browser/catalog/*light-refinement*
            docs/test-results/detail-report.json
          retention-days: 3
          if-no-files-found: ignore
