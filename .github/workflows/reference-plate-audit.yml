name: Reference plate audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/reference-plate-audit.yml]
permissions:
  contents: write
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Prepare the unchanged source
        run: |
          mkdir -p "$RUNNER_TEMP/plate-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/plate-evidence/audit-parent.txt"
          echo 'Before screenshots and full material matrix: audit 36517074263. Product source is unchanged since that baseline.' > "$RUNNER_TEMP/plate-evidence/before-origin.txt"
          npm ci --prefix registry
          npm ci --prefix docs
          cd docs
          npx playwright install --with-deps chromium
      - name: Apply the authored changes and visual-review correction without publishing them
        run: |
          gh api repos/andongmin94/neumorphism-ui/git/blobs/a0ab0fc2e77c2016735443fbdff4523c0f48f95a --jq .content | base64 --decode > "$RUNNER_TEMP/reference-patch.py"
          python3 "$RUNNER_TEMP/reference-patch.py"
          gh api repos/andongmin94/neumorphism-ui/git/blobs/e233e622d012f4fbbbcc0c4d348f7d7ce9cabe89 --jq .content | base64 --decode > "$RUNNER_TEMP/reference-refinement.py"
          python3 "$RUNNER_TEMP/reference-refinement.py"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/components/docs/theme-preview.module.css')
          s = p.read_text().replace('container-type: inline-size;', 'container: reference-canvas / inline-size;', 1)
          s = s.replace('.metric { container-type: inline-size;', '.metric { container: reference-metric / inline-size;')
          s = s.replace('@container (', '@container reference-canvas (')
          p.write_text(s)
          PY
      - name: Source generation, contracts and documentation build
        run: |
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          git diff --check
      - name: Reference geometry, localized actions and source-only plates
        working-directory: docs
        run: |
          result=0
          npx playwright test --config=playwright.detail.config.ts reference-plate.spec.ts sculptural-layout.spec.ts sculptural-viewport.spec.ts docs-reading.spec.ts || result=1
          cp test-results/detail-report.json "$RUNNER_TEMP/plate-evidence/reference-report.json"
          npx playwright test --config=playwright.material.config.ts plate.spec.ts || result=1
          exit "$result"
      - name: Prepare an immutable source-derived tree for visual review
        run: |
          rm .github/workflows/reference-plate-audit.yml
          npm run check:generated --prefix registry
          git add -A
          git diff --cached --check
          git diff --cached --stat > "$RUNNER_TEMP/plate-evidence/change-stat.txt"
          git diff --cached > "$RUNNER_TEMP/plate-evidence/source.patch"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'plate-evidence'
          changes = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          entries=[]
          for name in changes:
              p=Path(name)
              entry={'path':name,'mode':'100644','type':'blob'}
              if p.exists():
                  entry['content']=p.read_text()
                  target=root/'source'/name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_text(entry['content'])
              else: entry['sha']=None
              entries.append(entry)
          body={'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree':entries}
          payload=Path(os.environ['RUNNER_TEMP'])/'plate-tree-request.json'
          payload.write_text(json.dumps(body))
          result=subprocess.check_output(['gh','api','--method','POST','repos/andongmin94/neumorphism-ui/git/trees','--input',str(payload)],text=True)
          response=json.loads(result)
          report={'tree':response['sha'],'parent':os.environ['GITHUB_SHA'],'sourceBaseline':'941228f8f86d96b5d8935c4e4d2ebac7952a5718','run':os.environ['GITHUB_RUN_ID'],'changedFiles':changes,'published':False}
          (root/'candidate.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - name: Save actual screenshots, reports and source without dependency assets
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/plate-evidence/after"
          if [ -d docs/test-results ]; then cp -R docs/test-results/. "$RUNNER_TEMP/plate-evidence/after/"; fi
          git diff > "$RUNNER_TEMP/plate-evidence/working.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reference-plate-evidence
          path: ${{ runner.temp }}/plate-evidence
          retention-days: 7
          if-no-files-found: error
