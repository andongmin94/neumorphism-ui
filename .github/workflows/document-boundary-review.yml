name: Document boundary review
on:
  push:
    branches: [main]
    paths: [.github/workflows/document-boundary-review.yml]
permissions:
  contents: write
concurrency:
  group: document-boundary-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Restore the exact boundary review scripts
        run: |
          git fetch --depth=1 origin e4916cfc89c793b9348f249dcde71c61304bc3b3
          python3 - <<'PY'
          import re, subprocess, textwrap
          source=subprocess.check_output(['git','show','e4916cfc89c793b9348f249dcde71c61304bc3b3:.github/workflows/document-boundary-review.yml'],text=True)
          blocks=re.findall(r"          python3 - <<'PY'\n(.*?)\n          PY",source,re.S)
          assert len(blocks)==2
          exec(compile(textwrap.dedent(blocks[0]),'<boundary review setup>','exec'),{})
          PY
      - name: Prepare reference table and recipe layout corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('/tmp/divider-refine.py').write_text(r'''
          from pathlib import Path
          import re
          p=Path('docs/src/app.css')
          s=p.read_text()
          def edit(before,after):
              global s
              assert s.count(before)==1,(before[:80],s.count(before))
              s=s.replace(before,after)
          edit(""".docs-link-list {
            display: grid;
            margin-top: 18px;
            border-top: 1px solid var(--docs-line-strong);
          }

          .docs-link-list > a {
            display: flex;
            min-height: 52px;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 0 12px;
            border-bottom: 1px solid var(--docs-line-strong);
            color: var(--foreground);
            text-decoration: none;
          }

          .docs-link-list > a:hover {
            background: var(--neu-surface-soft);
          }""",""".docs-link-list {
            display: grid;
            gap: 0;
            margin-top: 16px;
            border: 0;
          }

          .docs-link-list > a {
            display: flex;
            min-height: 48px;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            color: var(--foreground);
            text-decoration: none;
            transition: background-color var(--neu-duration);
          }

          .docs-link-list > a + a {
            border-top: 1px solid var(--docs-line-soft);
          }

          .docs-link-list > a:is(:hover, :focus-visible) {
            background: var(--neu-surface-soft);
            box-shadow: none;
            transform: none;
          }""")
          marker=s.index('/* Neobrutal documentation shell parity.')
          base,canonical=s[:marker],s[marker:]
          old={'.docs-link-list','.docs-link-list > a','.docs-link-list > a:hover','.docs-link-list > a:active'}
          base=re.sub(r'\n([^{}@]+)\{([^{}]*)\}',lambda m:'' if m.group(1).strip() in old else m.group(0),base)
          s=base+canonical
          edit(""".chart-reference-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            border: 0;
          }

          .chart-reference-card {
            border: 1px solid var(--docs-line-strong);
            border-radius: var(--neu-radius-surface);
            background: var(--neu-surface);
            border-color: var(--docs-line-soft);
          }""",""".chart-reference-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
            align-items: start;
            border: 0;
          }

          .chart-reference-card {
            display: flex;
            min-width: 0;
            flex-direction: column;
            gap: 12px;
            padding: 24px;
            border: 1px solid var(--docs-line-soft);
            border-radius: var(--neu-radius-surface);
            background: var(--neu-surface);
          }

          .chart-reference-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: var(--foreground-soft);
            font-family: var(--font-mono);
            font-size: 0.68rem;
          }

          .chart-reference-card h3 {
            margin: 0;
            font-size: 1.1rem;
            line-height: 1.35;
          }

          .chart-reference-card > p {
            margin: 0;
            color: var(--docs-text-soft);
            font-size: 0.85rem;
            line-height: 1.65;
          }

          .chart-reference-card > details {
            min-width: 0;
            padding-top: 12px;
            border-top: 1px solid var(--docs-line-soft);
          }

          .chart-reference-card summary {
            min-height: 32px;
            padding-block: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 650;
            line-height: 24px;
          }

          .chart-reference-card > details > :not(summary) {
            margin-top: 12px;
          }""")
          edit('/* Only titled reference sections need a label column. No synthetic empty rows. */',"""/* Reference tables keep one rule per row boundary, not a second framed surface. */
          .docs-reference-article table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            font-size: 0.875rem;
            line-height: 1.65;
          }

          .docs-reference-article :is(th, td) {
            padding: 12px 16px;
            vertical-align: top;
            text-align: left;
            overflow-wrap: anywhere;
          }

          .docs-reference-article th:first-child {
            width: 32%;
          }

          .docs-reference-article thead th {
            padding-top: 0;
            font-weight: 650;
            border-bottom: 1px solid var(--docs-line-soft);
          }

          .docs-reference-article tbody th {
            font-weight: 500;
          }

          .docs-reference-article tbody tr + tr > :is(th, td) {
            border-top: 1px solid var(--docs-line-soft);
          }

          /* Only titled reference sections need a label column. No synthetic empty rows. */""")
          p.write_text(s)
          Path('/tmp/divider-evidence/app-after.css').write_text(s)
          p=Path('docs/visual-reference.md')
          p.write_text(p.read_text()+"\nReference link rows use a single internal separator with no residual rounded-card borders. Credits table headers and rows keep readable gutters and one row rule. The chart recipe grid owns its two/one-column layout, card padding and disclosure spacing explicitly; no missing earlier presentation layer is required.\n")
          p=Path('docs/tests/detail/document-rhythm.spec.ts')
          p.write_text(p.read_text()+Path('/tmp/divider-extra-tests.ts').read_text())
          ''')
          Path('/tmp/divider-extra-tests.ts').write_text(r'''
          test("reference link rows use one internal rule without card borders", async ({ page }, info) => {
            await page.goto("/en/docs");
            for (const list of await page.locator(".docs-link-list").all()) {
              await expect(list).toHaveCSS("border-top-width", "0px");
              await expect(list).toHaveCSS("row-gap", "0px");
              const links = list.locator(":scope > a");
              for (let i = 0; i < await links.count(); i++) {
                await expect(links.nth(i)).toHaveCSS("border-top-width", i ? "1px" : "0px");
                await expect(links.nth(i)).toHaveCSS("border-bottom-width", "0px");
                await expect(links.nth(i)).toHaveCSS("border-radius", "0px");
              }
            }
            await page.locator(".docs-reference-article").screenshot({ path: info.outputPath("reference-links.png"), animations: "disabled" });
          });
          test("chart reference layout keeps gutters and source disclosure boundaries", async ({ page }, info) => {
            await page.goto("/en/charts");
            const grid = page.locator(".chart-reference-grid");
            await grid.scrollIntoViewIfNeeded();
            await grid.screenshot({ path: info.outputPath("chart-reference-grid.png"), animations: "disabled" });
            await expect(grid).toHaveCSS("display", "grid");
            await expect(grid).toHaveCSS("gap", "24px");
            const cards = grid.locator(".chart-reference-card");
            expect(await cards.count()).toBe(8);
            for (const card of await cards.all()) {
              await expect(card).toHaveCSS("padding-left", "24px");
              await expect(card).toHaveCSS("gap", "12px");
              for (const details of await card.locator(":scope > details").all()) {
                await expect(details).toHaveCSS("border-top-width", "1px");
                await expect(details).toHaveCSS("border-bottom-width", "0px");
              }
            }
            const details = cards.first().locator("details").first();
            await details.locator("summary").click();
            await expect(details).toHaveAttribute("open", "");
            expect(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth + 1)).toBe(true);
            await cards.first().screenshot({ path: info.outputPath("chart-open-disclosure.png"), animations: "disabled" });
          });
          test("reference tables keep column gutters and one row boundary", async ({ page }) => {
            await page.goto("/en/docs/credits");
            const table = page.locator(".docs-reference-article table");
            const heading = table.locator("thead th").first();
            await expect(heading).toHaveCSS("text-align", "left");
            await expect(heading).toHaveCSS("border-bottom-width", "1px");
            const rows = table.locator("tbody tr");
            for (let i = 0; i < await rows.count(); i++) {
              const cell = rows.nth(i).locator("th");
              await expect(cell).toHaveCSS("padding-right", "16px");
              await expect(cell).toHaveCSS("border-top-width", i ? "1px" : "0px");
              await expect(cell).toHaveCSS("border-bottom-width", "0px");
            }
          });
          ''')
          PY
      - name: Build the unchanged product for the before evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run build --prefix docs
          cd docs && npx playwright install --with-deps chromium
      - name: Reproduce reference boundary defects before changing CSS
        working-directory: docs
        run: |
          mkdir -p /tmp/divider-evidence
          set +e
          npx playwright test --config=playwright.detail.config.ts document-rhythm.spec.ts --grep 'reference boundary' --project=desktop-light --output=test-results/divider-before 2>&1 | tee /tmp/divider-evidence/before.log
          result=${PIPESTATUS[0]}
          set -e
          echo "$result" > /tmp/divider-evidence/before-exit.txt
          cp test-results/detail-report.json /tmp/divider-evidence/before.json
          test "$result" -ne 0
      - name: Correct owning CSS rules and regenerate documentation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 /tmp/divider-patch.py
          python3 /tmp/divider-refine.py
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          npm run check:generated --prefix registry
      - name: Verify corrected boundaries across documentation and catalog
        working-directory: docs
        run: |
          set +e
          npx playwright test --config=playwright.detail.config.ts document-rhythm.spec.ts catalog.spec.ts --output=test-results/divider-after 2>&1 | tee /tmp/divider-evidence/after.log
          result=${PIPESTATUS[0]}
          set -e
          cp test-results/detail-report.json /tmp/divider-evidence/after.json
          test "$result" -eq 0
          node -e "const r=require('./test-results/detail-report.json'); if(r.stats.unexpected || r.stats.flaky) process.exit(1)"
      - name: Prepare the exact tested tree without moving main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/document-boundary-review.yml
          git add docs .github/workflows/document-boundary-review.yml
          git diff --cached --stat > /tmp/divider-evidence/change-stat.txt
          git diff --cached --binary > /tmp/divider-evidence/reviewed.patch
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def api(endpoint,payload):
              return json.loads(subprocess.check_output(['gh','api','--method','POST',endpoint,'--input','-'],input=json.dumps(payload).encode()))
          repo=os.environ['GITHUB_REPOSITORY']
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          elements=[]
          for line in subprocess.check_output(['git','diff','--cached','--name-status'],text=True).splitlines():
              status,path=line.split('\t',1)
              if status=='D':
                  elements.append({'path':path,'mode':'100644','type':'blob','sha':None})
              else:
                  blob=api(f'repos/{repo}/git/blobs',{'content':Path(path).read_text(),'encoding':'utf-8'})
                  elements.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=api(f'repos/{repo}/git/trees',{'base_tree':base,'tree':elements})
          Path('/tmp/divider-evidence/tested-tree.json').write_text(json.dumps({'parent':os.environ['GITHUB_SHA'],'tree':tree['sha'],'files':elements},indent=2))
          print('TESTED_TREE',tree['sha'])
          PY
      - name: Preserve evidence
        if: always()
        run: |
          mkdir -p /tmp/divider-evidence
          cp -r docs/test-results/divider-* /tmp/divider-evidence/ 2>/dev/null || true
          cp docs/src/app.css /tmp/divider-evidence/app-current.css
          cp docs/tests/detail/document-rhythm.spec.ts /tmp/divider-evidence/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: document-boundary-review
          path: /tmp/divider-evidence
          retention-days: 7
          if-no-files-found: error
