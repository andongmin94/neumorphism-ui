name: Table status review
# Repeat the unchanged review because its completed run and artifact became unavailable.
on:
  push:
    branches: [main]
    paths: [.github/workflows/table-status-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Build unchanged source and capture real table previews
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/table-status-evidence
          npm ci --prefix registry
          npm ci --prefix docs
          npm run build --prefix docs
          cd docs
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.detail.config.ts --grep 'catalog detail: table$' --output=test-results/docs-browser/table-status-before
      - name: Make table cells own atomic status-label layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('registry/src/components/ui/table.tsx');s=p.read_text()
          old='p-4 align-middle text-[var(--foreground)] [&:has([role=checkbox])]:pr-0'
          assert s.count(old)==1
          s=s.replace(old,old+' [&_[data-slot=badge]]:whitespace-nowrap');p.write_text(s)
          p=Path('docs/tests/material/controls.tsx');s=p.read_text()
          marker='import { Badge } from "@/components/ui/badge";';assert s.count(marker)==1
          s=s.replace(marker,marker+'\nimport { Table, TableHeader, TableBody, TableRow, TableHead, TableCell } from "@/components/ui/table";')
          marker='    </div>\n    <section data-testid="pagination"';assert s.count(marker)==1
          addition='''      <section data-testid="table-statuses" className="grid min-w-0 content-start gap-5"><h2 className="text-base font-semibold">Readable table statuses</h2>
                  <div data-testid="narrow-table-host" className="w-full max-w-80 min-w-0">
                    <Table containerProps={{ role: "region", "aria-label": "Status table", tabIndex: 0 }}>
                      <TableHeader><TableRow>{["Symbol", "Price", "Change", "Status"].map(label => <TableHead key={label}>{label}</TableHead>)}</TableRow></TableHeader>
                      <TableBody>{[["NVDA", "$181.92", "+2.41%", "Open"], ["005930", "₩72,400", "+1.08%", "Selected"], ["TSLA", "$318.27", "−0.64%", "Watch"]].map(row => <TableRow key={row[0]}><TableCell>{row[0]}</TableCell><TableCell>{row[1]}</TableCell><TableCell>{row[2]}</TableCell><TableCell><Badge variant="primary">{row[3]}</Badge></TableCell></TableRow>)}</TableBody>
                    </Table>
                  </div>
                </section>
          '''
          s=s.replace(marker,addition+marker);p.write_text(s)
          p=Path('docs/tests/material/control-anatomy.spec.ts');s=p.read_text()
          marker='    test("pagination preserves every target';assert s.count(marker)==1
          addition='''    test("table statuses stay atomic while standalone badges still wrap", async ({ page }, info) => {
                const host = page.getByTestId("narrow-table-host");
                const region = page.getByRole("region", { name: "Status table", exact: true });
                const labels = region.locator('[data-slot="badge"]');
                await expect(labels).toHaveCount(3);
                for (const hostWidth of [320, 228]) {
                  await host.evaluate((e, size) => { (e as HTMLElement).style.width = `${size}px`; }, hostWidth);
                  for (const badge of await labels.all()) {
                    await expect(badge).toHaveCSS("white-space", "nowrap");
                    expect((await badge.boundingBox())!.height).toBeLessThanOrEqual(22);
                    expect(await badge.evaluate(e => e.scrollWidth - e.clientWidth)).toBeLessThanOrEqual(1);
                  }
                  expect(await region.evaluate(e => e.scrollWidth)).toBeGreaterThan((await region.boundingBox())!.width);
                  await region.evaluate(e => { e.scrollLeft = e.scrollWidth; });
                  const bounds = (await region.boundingBox())!;
                  for (const badge of await labels.all()) {
                    const r = (await badge.boundingBox())!;
                    expect(r.x).toBeGreaterThanOrEqual(bounds.x);
                    expect(r.x + r.width).toBeLessThanOrEqual(bounds.x + bounds.width);
                  }
                  expect(await page.evaluate(() => document.documentElement.scrollWidth)).toBeLessThanOrEqual(width + 1);
                }
                const longBadge = page.getByTestId("long-badge");
                expect((await longBadge.boundingBox())!.height).toBeGreaterThan(22);
                expect(await longBadge.evaluate(e => e.scrollWidth - e.clientWidth)).toBeLessThanOrEqual(1);
                await host.screenshot({ path: info.outputPath("table-statuses.png"), animations: "disabled" });
              });
          '''
          s=s.replace(marker,addition+marker);p.write_text(s)
          p=Path('docs/visual-reference.md');p.write_text(p.read_text()+'\nTable cells keep status badges on one line; the table scroll container owns narrow-screen overflow instead of splitting short status words into vertical fragments. Standalone badges retain long-label wrapping. Source-only checks cover 228px and 320px hosts in desktop/mobile light/dark, readable labels at the horizontal scroll end, and unchanged long standalone badges.\n')
          PY
      - name: Regenerate and validate the changed installable source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
      - name: Check source-only compositions and refreshed table previews
        working-directory: docs
        run: |
          MATERIAL_PHASE=table-status-after npx playwright test --config=playwright.material.config.ts
          npx playwright test --config=playwright.detail.config.ts --grep 'catalog detail: table$' --output=test-results/docs-browser/table-status-after
      - name: Prepare the tested tree without moving main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          workflow='.github/workflows/table-status-review.yml'
          Path(workflow).unlink()
          allowed={workflow,'registry/src/components/ui/table.tsx','registry/public/r/table.json','docs/public/r/table.json','docs/tests/material/controls.tsx','docs/tests/material/control-anatomy.spec.ts','docs/visual-reference.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==allowed,(changed,allowed)
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip()
          entries=[]
          for file in sorted(changed):
            entry={'path':file,'mode':'100644','type':'blob'}
            if Path(file).exists(): entry['content']=Path(file).read_text()
            else: entry['sha']=None
            entries.append(entry)
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',data=json.dumps({'base_tree':tree,'tree':entries}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request) as response: created=json.load(response)
          Path('/tmp/table-status-evidence/tested-tree.json').write_text(json.dumps({'parent':os.environ['GITHUB_SHA'],'tree':created['sha'],'files':sorted(changed)},indent=2))
          Path('/tmp/table-status-evidence/changes.diff').write_bytes(subprocess.check_output(['git','diff']))
          PY
      - name: Preserve actual screenshots and reports
        if: always()
        run: |
          cp -R docs/test-results /tmp/table-status-evidence/ || true
          tar -czf /tmp/table-status-evidence/review-source.tar.gz registry/src/components/ui/table.tsx docs/tests/material/controls.tsx docs/tests/material/control-anatomy.spec.ts docs/visual-reference.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: table-status-review
          path: /tmp/table-status-evidence
          retention-days: 7
          if-no-files-found: error
