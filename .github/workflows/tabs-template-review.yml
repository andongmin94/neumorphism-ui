name: Tabs and template review
on:
  status:
permissions:
  contents: write
jobs:
  candidate:
    if: >-
      github.ref == 'refs/heads/main' && github.event.context == 'Vercel' &&
      github.event.state == 'success' && github.event.sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Apply the integrity-checked authored patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          blob = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/blobs/911034ed1a85bab2e0c2f21904fd09752e8b0c71']))
          patch = lzma.decompress(base64.b64decode(blob['content']))
          assert hashlib.sha256(patch).hexdigest() == 'b5ff29da5845f15574122aec07c4cb5e7ce852c770ee3dc8d3132e0c9d747979'
          subprocess.run(['git','apply','--check','--index','-'], input=patch, check=True)
          subprocess.run(['git','apply','--index','-'], input=patch, check=True)
          p = pathlib.Path('docs/components/docs/template-page.module.css')
          text = p.read_text(); assert text.count('padding-bottom: 20px;') == 1
          p.write_text(text.replace('padding-bottom: 20px;', 'padding-bottom: 0;\n  border-bottom: 0;'))
          p = pathlib.Path('docs/tests/detail/template-boundary.spec.ts')
          text = p.read_text(); marker='      await expect(frame).toHaveCount(1);'
          assert text.count(marker) == 1
          p.write_text(text.replace(marker, marker + '\n      await expect(page.locator(".docs-page-header")).toHaveCSS("border-bottom-width", "0px");'))
          p = pathlib.Path('docs/playwright.published.config.ts')
          text = p.read_text(); assert text.count('testMatch: [') == 1
          p.write_text(text.replace('testMatch: [', 'testMatch: ["**/detail/template-boundary.spec.ts", '))
          p = pathlib.Path('docs/visual-reference.md')
          p.write_text(p.read_text() + '''

          ## Compact tab states and template boundaries

          Installed Tabs retain their 44px rail and 14px labels. A low-contrast inset
          rail and short contact shadow replace the wide blurred shadow. The selected
          segment uses primary/on-primary tokens, not blue text on a near-identical
          gray surface. Keyboard focus is independent of selection and visible on both
          active and inactive segments. Base UI still owns orientation, disabled tabs,
          manual activation and controlled/uncontrolled state. No new API or package.

          All eight template detail pages use one documentation-owned frame with a
          localized preview heading, literal installation identifier and Install/Source
          anchors. Its single border and muted toolbar show where the example begins
          and ends; the canvas has no added elevation or clipping. The old page-header
          rule is removed rather than doubled above the frame. Installation and source
          documentation remain outside. Mobile gutters preserve workspace width.
          The real examples and their state are not replaced with images or iframes.
          Catalog thumbnails stay unframed. Previous sidebar, metadata and language-menu
          fixes and Dark+ rendering remain; do not restore removed preview chrome.

          Source-only tabs-clarity tests cover both orientations, four locales, disabled
          and selected states, keyboard activation, long labels and 320/390/1440px in
          both themes. template-boundary tests check every template and its separation
          from documentation, including the published site. MD-01–10 remain in their
          existing suites. Actual runs and visual review are reported separately.
          ''')
          pathlib.Path('.github/workflows/tabs-template-review.yml').unlink()
          PY
      - name: Source contracts and generated registry synchronization
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
      - name: Focused browser checks and full catalog captures
        working-directory: docs
        run: |
          npx playwright install --with-deps chromium
          result=0
          npx playwright test --config=playwright.material.config.ts tabs-clarity.spec.ts composition.spec.ts || result=1
          npx playwright test --config=playwright.detail.config.ts template-boundary.spec.ts chrome-finish.spec.ts docs-reading.spec.ts docs-hydration.spec.ts catalog.spec.ts surface-system.spec.ts || result=1
          exit "$result"
      - name: Save source-derived tree for visual review without updating main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run check:generated --prefix registry
          git diff --check HEAD
          mkdir -p "$RUNNER_TEMP/tabs-review"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          repo=os.environ['GITHUB_REPOSITORY']; parent=os.environ['GITHUB_SHA']
          base=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/commits/{parent}']))
          paths=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          paths+=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          entries=[]
          for name in sorted(set(paths)):
              p=pathlib.Path(name); entry=dict(path=name,mode='100644',type='blob')
              if p.exists(): entry['content']=p.read_text()
              else: entry['sha']=None
              entries.append(entry)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'tabs-review'
          request=out/'request.json';request.write_text(json.dumps(dict(base_tree=base['tree']['sha'],tree=entries)))
          tree=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/trees','--input',str(request)]));request.unlink()
          (out/'candidate.json').write_text(json.dumps(dict(parent=parent,tree=tree['sha'],paths=sorted(set(paths))),indent=2))
          (out/'candidate-source.json').write_text(json.dumps({e['path']:e.get('content') for e in entries},ensure_ascii=False))
          (out/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','--binary','HEAD']))
          print(json.dumps(dict(parent=parent,tree=tree['sha'],files=len(entries))))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tabs-template-candidate
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/tabs-review
            docs/test-results
