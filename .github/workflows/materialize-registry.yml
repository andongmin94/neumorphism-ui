name: Materialize registry changes
on:
  push:
    branches: [main]
    paths:
      - "registry/package.json"
      - "registry/catalog.json"
      - "registry/src/**"
      - "docs/package.json"
      - "docs/components/**"
      - "docs/i18n/**"
      - "registry/tests/**"
      - ".github/workflows/materialize-registry.yml"
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh locks and generated registry
        run: |
          npm install --package-lock-only --ignore-scripts --prefix registry
          npm install --package-lock-only --ignore-scripts --prefix docs
          npm ci --prefix registry
          npm ci --prefix docs
          npm run build --prefix registry
          npm run sync:docs --prefix registry
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/package-lock.json docs/package-lock.json registry/registry.json registry/public/r docs/public/r docs/src/theme.css docs/components/docs/theme-bootstrap.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: materialize command registry outputs"
          git push origin HEAD:main
