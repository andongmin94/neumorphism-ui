name: Materialize registry changes
on:
  push:
    branches: [main]
    paths:
      - "registry/catalog.json"
      - "registry/src/**"
      - ".github/workflows/materialize-registry.yml"
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify registry source
        run: |
          npm ci --prefix registry
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/registry.json registry/public/r docs/public/r
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: materialize blog post template"
          git push origin HEAD:main
