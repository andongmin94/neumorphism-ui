name: Materialize registry changes
on:
  push:
    branches: [main]
    paths:
      - "registry/catalog.json"
      - "registry/src/**"
      - "docs/components/**"
      - "docs/src/pages/templates/**"
      - "docs/tests/browser/workspaces.spec.ts"
      - ".github/workflows/materialize-registry.yml"
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify source and generated registry
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/registry.json registry/public/r docs/public/r docs/src/theme.css docs/components/docs/theme-bootstrap.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: materialize link hub template"
          git push origin HEAD:main
