name: Verify
# Fumapress documentation verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      comprehensive:
        description: Run every installation, presentation and browser-engine check
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - run: npm ci --prefix registry && npm ci --prefix docs
      - name: Registry build, examples, and source contracts
        run: |
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
      - name: Documentation verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
      - name: Browser engines
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Comprehensive browser engines
        if: ${{ inputs.comprehensive }}
        working-directory: docs
        run: npx playwright install --with-deps firefox webkit
      - name: Hydrated documentation, theme output, and source recovery
        working-directory: docs
        run: npm run test:browser
      - name: Installed components and rendered interaction states
        if: ${{ !inputs.comprehensive }}
        run: npm run consumer:verify --prefix registry -- --smoke
      - name: Complete installed-component regression matrix
        if: ${{ inputs.comprehensive }}
        run: npm run consumer:verify --prefix registry
      - name: Generation must leave the repository clean
        run: |
          npm run check:generated --prefix registry
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Dependency security (blocking)
        if: ${{ !cancelled() }}
        run: |
          # Keep the same verify job red on any failed audit, after collecting
          # functional evidence. Audit both projects, including development tools.
          mkdir -p "$RUNNER_TEMP/dependency-audit"
          result=0
          for project in registry docs; do
            npm audit --prefix "$project" --audit-level=high --json > "$RUNNER_TEMP/dependency-audit/$project.json" || result=1
            cat "$RUNNER_TEMP/dependency-audit/$project.json"
          done
          exit "$result"
      - name: Save dependency audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/dependency-audit
          retention-days: 7
          if-no-files-found: error
      - name: Save UI verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-verification
          path: docs/test-results
          retention-days: 7
          if-no-files-found: ignore

  verify-installations:
    if: ${{ inputs.comprehensive }}
    name: Independent installations (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: registry/package-lock.json
      - name: Build registry installation inputs
        run: |
          npm ci --prefix registry
          npm run build --prefix registry
      - name: Verify independent items
        run: node registry/scripts/verify-independent-items.mjs --shard=${{ matrix.shard }}/3
      - name: Save independent installation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: independent-items-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: error
          path: docs/test-results/independent-items

  presentation:
    if: ${{ inputs.comprehensive }}
    name: Documentation presentation (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [material, detail]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Build documentation presentation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm run build --prefix docs
      - name: Presentation browser
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Capture key documentation surfaces and interaction quality
        working-directory: docs
        run: |
          # Each suite has its own runner; none is skipped if another fails.
          case "${{ matrix.suite }}" in
            material) npx playwright test --config=playwright.material.config.ts ;;
            detail) npx playwright test --config=playwright.detail.config.ts ;;
          esac
      - name: Save presentation screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-presentation-${{ matrix.suite }}
          retention-days: 7
          if-no-files-found: error
          path: |
            docs/test-results/docs-browser
            docs/test-results/docs-report.json
            docs/test-results/material-report.json
            docs/test-results/detail-report.json
      - name: Save directly viewable workspace detail
        if: ${{ matrix.suite == 'detail' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: docs/test-results/docs-browser/catalog/*-desktop-light/theme-interaction.png
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Save directly viewable input anatomy
        if: ${{ matrix.suite == 'detail' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: docs/test-results/docs-browser/catalog/*-desktop-light/input-group.png
          archive: false
          retention-days: 7
          if-no-files-found: error
