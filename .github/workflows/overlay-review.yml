name: Overlay layering review
on:
  push:
    branches: [main]
    paths: [.github/workflows/overlay-review.yml]
permissions:
  contents: write
concurrency:
  group: overlay-layer-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Correct the owning shell layer and add occlusion checks
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          path = Path('docs/src/app.css')
          css = path.read_text()
          blocks = list(re.finditer(r'(?m)^\.site-header\s*\{[^}]*\}', css))
          assert blocks and any('z-index: 70;' in m.group() for m in blocks)
          # Remove historical header z-index declarations; the current owning
          # block has one layer below the registry's z-50 portals/backdrops.
          for n, match in reversed(list(enumerate(blocks))):
              block = re.sub(r'(?m)^\s*z-index:[^;]+;\n', '', match.group())
              if n == len(blocks) - 1:
                  block = block.replace('{\n', '{\n  z-index: 30;\n', 1)
              css = css[:match.start()] + block + css[match.end():]
          path.write_text(css)
          notes = Path('docs/visual-reference.md')
          notes.write_text(notes.read_text() + '\n\n## Overlay occlusion review\n\nThe sticky documentation header is below registry backdrops and popups. Sheet, Dialog and Drawer checks include actual hit testing over the header, not only visible DOM nodes. Sheet title and close control remain unobscured at normal and 500px viewport heights in all four desktop/mobile light/dark projects.\n')
          PY
          cat > docs/tests/detail/overlay-layering.spec.ts <<'TS'
          import { expect, test, type Locator } from "@playwright/test";

          async function isPaintedAbove(locator: Locator) {
            return locator.evaluate(element => {
              const rect = element.getBoundingClientRect();
              const topmost = document.elementFromPoint(rect.x + rect.width / 2, rect.y + rect.height / 2);
              return topmost !== null && element.contains(topmost);
            });
          }

          test("sheet title and close button stay above the sticky header", async ({ page }, info) => {
            const initial = page.viewportSize()!;
            for (const height of [initial.height, 500]) {
              await page.setViewportSize({ width: initial.width, height });
              await page.goto("/en/components/sheet");
              const trigger = page.getByRole("button", { name: "Profile settings", exact: true });
              await trigger.click();
              const dialog = page.getByRole("dialog");
              await expect(dialog).toBeVisible();
              const title = dialog.locator('[data-slot="dialog-title"]');
              const close = dialog.locator('button[aria-label="Close"]');
              await expect(title).toBeInViewport({ ratio: 1 });
              await expect(close).toBeInViewport({ ratio: 1 });
              expect(await isPaintedAbove(title)).toBe(true);
              expect(await isPaintedAbove(close)).toBe(true);
              const header = await page.locator(".site-header").boundingBox();
              const covered = await page.evaluate(({ x, y }) => {
                const top = document.elementFromPoint(x, y);
                return top !== null && !top.closest(".site-header") &&
                  !!top.closest('[data-slot="sheet-content"], [data-slot="dialog-overlay"]');
              }, { x: header!.x + 8, y: header!.y + 24 });
              expect(covered).toBe(true);
              await page.screenshot({ path: info.outputPath(`sheet-unobscured-${height}.png`), animations: "disabled" });
              await close.click();
              await expect(dialog).toBeHidden();
              await expect(trigger).toBeFocused();
            }
          });

          for (const entry of [
            { slug: "dialog", name: "Edit profile", overlay: "dialog-overlay" },
            { slug: "drawer", name: "Profile settings", overlay: "drawer-overlay" },
          ]) {
            test(`${entry.slug} modal layer covers header actions`, async ({ page }, info) => {
              await page.goto(`/en/components/${entry.slug}`);
              const trigger = page.getByRole("button", { name: entry.name, exact: true });
              await trigger.click();
              const dialog = page.getByRole("dialog");
              await expect(dialog).toBeVisible();
              const overlay = page.locator(`[data-slot="${entry.overlay}"]`);
              await expect(overlay).toBeVisible();
              const layers = await page.evaluate(overlaySlot => ({
                header: Number(getComputedStyle(document.querySelector(".site-header")!).zIndex),
                overlay: Number(getComputedStyle(document.querySelector(`[data-slot="${overlaySlot}"]`)!).zIndex),
                top: document.elementFromPoint(8, 24)?.closest(".site-header") !== null,
              }), entry.overlay);
              expect(layers.header).toBeLessThan(layers.overlay);
              expect(layers.top).toBe(false);
              await page.screenshot({ path: info.outputPath(`${entry.slug}-header-covered.png`), animations: "disabled" });
              await page.keyboard.press("Escape");
              await expect(dialog).toBeHidden();
              await expect(trigger).toBeFocused();
            });
          }
          TS
      - name: Build unchanged registry and corrected documentation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          npm run check:generated --prefix registry
      - name: Inspect modal layers and preserve shell behavior
        working-directory: docs
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.detail.config.ts tests/detail/overlay-layering.spec.ts tests/detail/preview-layout.spec.ts
          npx playwright test tests/browser/presentation.spec.ts tests/browser/docs-polish.spec.ts
      - name: Prepare exact tested tree without updating main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/overlay-review
          rm .github/workflows/overlay-review.yml
          git add docs .github/workflows/overlay-review.yml
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const allowed = new Set(['docs/src/app.css','docs/visual-reference.md','docs/tests/detail/overlay-layering.spec.ts','.github/workflows/overlay-review.yml']);
          const changed = execFileSync('git', ['diff','--cached','--no-renames','--name-status','-z']).toString().split('\0').filter(Boolean);
          const entries = [];
          for (let i = 0; i < changed.length; i += 2) {
            const [status, path] = changed.slice(i, i + 2);
            if (!allowed.has(path) || !['A','M','D'].includes(status)) throw new Error(`Unexpected path ${status} ${path}`);
            entries.push({ path, mode: '100644', type: 'blob', ...(status === 'D' ? { sha: null } : { content: readFileSync(path, 'utf8') }) });
          }
          const baseTree = execFileSync('git', ['rev-parse','HEAD^{tree}']).toString().trim();
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/trees`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ base_tree: baseTree, tree: entries }),
          });
          if (!response.ok) throw new Error(await response.text());
          const preparedTree = (await response.json()).sha;
          if (preparedTree !== execFileSync('git', ['write-tree']).toString().trim()) throw new Error('Tested tree mismatch');
          writeFileSync('/tmp/overlay-review/prepared-tree.json', JSON.stringify({ parent: process.env.GITHUB_SHA, preparedTree, changedFiles: entries.map(e => e.path) }, null, 2));
          JS
      - name: Save evidence
        if: always()
        run: |
          mkdir -p /tmp/overlay-review
          git diff HEAD > /tmp/overlay-review/reviewed.patch
          cp -R docs/test-results /tmp/overlay-review/evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: overlay-layer-review
          path: /tmp/overlay-review
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: error
