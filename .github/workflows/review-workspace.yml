      - name: Regenerate and validate the candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run build --prefix docs
          npm run lint --prefix registry
          npm test --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run check:generated --prefix registry
      - name: Install browser
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Run exact control and all-catalog checks
        working-directory: docs
        run: |
          npx playwright test tests/browser/presentation.spec.ts tests/browser/docs-polish.spec.ts
          npx playwright test --config=playwright.material.config.ts
          npx playwright test --config=playwright.detail.config.ts
      - name: Check public deployment independently
        continue-on-error: true
        run: npm run verify:deployed --prefix docs
      - name: Prepare generated Git tree without moving main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync, mkdirSync } from 'node:fs';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const paths=git('diff','--cached','--name-only','-z').split('\0').filter(Boolean);
          const tree=paths.map(path=>{const row=git('ls-files','--stage','--',path);return row?{path,mode:row.split(' ')[0],type:'blob',content:readFileSync(path,'utf8')}:{path,mode:'100644',type:'blob',sha:null};});
          const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/trees`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({base_tree:git('rev-parse','HEAD^{tree}'),tree})});
          const result=await response.json();if(!response.ok)throw new Error(JSON.stringify(result));
          const record={parent:process.env.GITHUB_SHA,tree:result.sha,files:paths};
          mkdirSync('docs/test-results/detail-review',{recursive:true});writeFileSync('docs/test-results/detail-review/prepared-tree.json',JSON.stringify(record,null,2));
          console.log('PREPARED_TREE '+JSON.stringify(record));
          JS
      - name: Save small review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: detail-review
          path: docs/test-results
          retention-days: 7
          if-no-files-found: warn
