name: Design finish review
on:
  status:
permissions:
  contents: write
jobs:
  candidate:
    if: >-
      github.ref == 'refs/heads/main' && github.event.context == 'Vercel' &&
      github.event.state == 'success' && github.event.sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Build the unchanged baseline
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm run build --prefix docs
          cd docs && npx playwright install --with-deps chromium
      - name: Record actual baseline geometry and screenshots
        working-directory: docs
        run: |
          mkdir -p "$RUNNER_TEMP/design-review/before"
          cat > tests/detail/pre-design.spec.ts <<'TS'
          import { expect, test } from '@playwright/test';
          import { writeFileSync } from 'node:fs';
          test('unmodified catalog and selection baseline', async ({page}, info) => {
            for (const width of [...new Set([info.project.use.viewport!.width, 768, 320])]) {
              await page.setViewportSize({width,height:1000});
              await page.goto('/en/templates');
              await page.evaluate(() => document.fonts.ready);
              await expect(page.locator('.template-card')).toHaveCount(8);
              const sizes = await page.locator('.template-card').evaluateAll(cards => cards.map(card => {
                const stage = card.querySelector('.template-preview-stage')!.getBoundingClientRect();
                const scale = card.querySelector('.template-preview-scale')!.getBoundingClientRect();
                return {title:card.querySelector('h2')!.textContent,stageWidth:stage.width,scaledWidth:scale.width,rightExcess:scale.right-stage.right};
              }));
              writeFileSync(info.outputPath(`geometry-${width}.json`),JSON.stringify(sizes,null,2));
              await page.screenshot({path:info.outputPath(`gallery-${width}.png`)});
              await page.locator('.template-card').nth(1).screenshot({path:info.outputPath(`settings-card-${width}.png`)});
            }
            await page.setViewportSize(info.project.use.viewport!);
            await page.goto('/en/components/toggle-group');
            await expect(page.locator('.component-example')).toHaveAttribute('aria-busy','false');
            await page.evaluate(() => document.fonts.ready);
            await page.locator('.component-example-panel').screenshot({path:info.outputPath('toggle-group.png')});
          });
          TS
          result=0
          npx playwright test --config=playwright.detail.config.ts pre-design.spec.ts || result=1
          cp -r test-results/docs-browser/catalog "$RUNNER_TEMP/design-review/before/"
          cp test-results/detail-report.json "$RUNNER_TEMP/design-review/baseline-report.json"
          rm tests/detail/pre-design.spec.ts
          exit "$result"
      - name: Apply the integrity-checked authored candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          blob=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/blobs/22e8e961c484c4a5f0770a35070e199fc61e1aa7']))
          patch=lzma.decompress(base64.b64decode(blob['content']))
          assert hashlib.sha256(patch).hexdigest()=='c85188b4549f3e132f4c63e054f14d1f2a71d96d0ebc5b7c876bad37f1e6de36'
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          pathlib.Path('.github/workflows/finish-design-review.yml').unlink()
          PY
      - name: Generate installable outputs and verify source contracts
        run: |
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
      - name: Targeted behavior, source-only states and complete catalog captures
        working-directory: docs
        run: |
          result=0
          npx playwright test tests/browser/components.spec.ts tests/browser/workspaces.spec.ts tests/browser/analytics.spec.ts || result=1
          cp test-results/docs-report.json "$RUNNER_TEMP/design-review/adjacent-report.json"
          npx playwright test --config=playwright.material.config.ts selection-finish.spec.ts control-anatomy.spec.ts composition.spec.ts tabs-clarity.spec.ts || result=1
          npx playwright test --config=playwright.detail.config.ts gallery-finish.spec.ts document-rhythm.spec.ts docs-reading.spec.ts chrome-finish.spec.ts template-boundary.spec.ts catalog.spec.ts || result=1
          exit "$result"
      - name: Prepare tested source tree for visual review without updating main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run check:generated --prefix registry
          git diff --check HEAD
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          repo=os.environ['GITHUB_REPOSITORY'];parent=os.environ['GITHUB_SHA']
          base=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/commits/{parent}']))
          paths=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          paths+=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          entries=[]
          for name in sorted(set(paths)):
              p=pathlib.Path(name); entry=dict(path=name,mode='100644',type='blob')
              if p.exists():entry['content']=p.read_text()
              else:entry['sha']=None
              entries.append(entry)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'design-review'
          request=out/'request.json';request.write_text(json.dumps(dict(base_tree=base['tree']['sha'],tree=entries)))
          tree=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/trees','--input',str(request)]));request.unlink()
          (out/'candidate.json').write_text(json.dumps(dict(parent=parent,tree=tree['sha'],paths=sorted(set(paths))),indent=2))
          (out/'candidate-source.json').write_text(json.dumps({e['path']:e.get('content') for e in entries},ensure_ascii=False))
          (out/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','--binary','HEAD']))
          print(json.dumps(dict(parent=parent,tree=tree['sha'],files=len(entries))))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: design-candidate
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/design-review
            docs/test-results
