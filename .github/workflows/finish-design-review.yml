name: Design finish review
on:
  status:
permissions:
  contents: read
jobs:
  snapshot:
    if: >-
      github.ref == 'refs/heads/main' && github.event.context == 'Vercel' &&
      github.event.state == 'success' && github.event.sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.sha }}
      - name: Export the current source and exact revision
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/design-source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/source-revision.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: design-source
          retention-days: 2
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/design-source.tar.gz
            ${{ runner.temp }}/source-revision.txt
