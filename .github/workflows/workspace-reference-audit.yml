name: Workspace reference audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/workspace-reference-audit.yml]
permissions:
  contents: write
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Build unchanged source and capture the baseline
        run: |
          mkdir -p "$RUNNER_TEMP/workspace-evidence/before"
          git rev-parse HEAD > "$RUNNER_TEMP/workspace-evidence/audit-parent.txt"
          npm ci --prefix registry
          npm ci --prefix docs
          npm run build --prefix docs
          cd docs
          npx playwright install --with-deps chromium
          cat > tests/detail/workspace-before.spec.ts <<'TS'
          import { test, expect } from '@playwright/test';
          for (const locale of ['en', 'ko', 'ja', 'zh']) {
            for (const [slug, slot] of [['dashboard', 'analytics-dashboard'], ['data-manager', 'data-manager'], ['cms', 'cms-workspace']]) {
              test(`before ${slug} ${locale}`, async ({ page }, info) => {
                await page.goto(`/${locale}/templates/${slug}`);
                await page.evaluate(() => document.fonts.ready);
                const root = page.locator(`[data-slot="${slot}"]`);
                await expect(root).toBeVisible();
                for (const width of [info.project.use.viewport!.width, 320]) {
                  await page.setViewportSize({ width, height: 1000 });
                  await root.screenshot({ path: info.outputPath(`workspace-${width}.png`) });
                }
              });
            }
            test(`before directory ${locale}`, async ({ page }, info) => {
              await page.goto(`/${locale}/components`);
              await page.evaluate(() => document.fonts.ready);
              const card = page.locator('.component-directory-card').first();
              await card.screenshot({ path: info.outputPath('directory-card.png') });
              await page.locator('.component-directory-results-head').scrollIntoViewIfNeeded();
              await page.mouse.move(0, 0);
              await page.screenshot({ path: info.outputPath('directory.png') });
              await page.setViewportSize({ width: 320, height: 900 });
              await card.screenshot({ path: info.outputPath('directory-320.png') });
            });
          }
          TS
          npx playwright test --config=playwright.detail.config.ts workspace-before.spec.ts
          cp -R test-results/. "$RUNNER_TEMP/workspace-evidence/before/"
          rm tests/detail/workspace-before.spec.ts
      - name: Apply authored source changes without advancing main
        run: |
          gh api repos/andongmin94/neumorphism-ui/git/blobs/c39d8d9c8a7ec3c345044648611e5748880153a0 --jq .content | base64 --decode > "$RUNNER_TEMP/workspace-patch.py"
          python3 "$RUNNER_TEMP/workspace-patch.py"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('registry/src/components/blocks/analytics-dashboard.tsx')
          s = p.read_text()
          old = 'className={`row-start-1 m-0 max-w-full text-[clamp(1.375rem,24cqi,2.25rem)] font-extrabold leading-[1.1] tracking-tight tabular-nums [overflow-wrap:anywhere] ${metric.key === "revenue" ? "text-[clamp(1rem,16cqi,2.25rem)]" : ""}`} '
          # Keep exactly one size utility on each readout, not competing font sizes.
          s = s.replace('max-w-full text-[clamp(1.375rem,24cqi,2.25rem)] font-extrabold', 'max-w-full font-extrabold', 1)
          s = s.replace('? "text-[clamp(1rem,16cqi,2.25rem)]" : ""', '? "text-[clamp(1rem,16cqi,2.25rem)]" : "text-[clamp(1.375rem,24cqi,2.25rem)]"', 1)
          p.write_text(s)
          p = Path('docs/tests/detail/workspace-plates.spec.ts')
          lines = p.read_text().splitlines()
          lines = ["    await expect(page).toHaveURL(url => url.pathname === destination);" if 'toHaveURL(new RegExp' in line else line for line in lines]
          p.write_text('\n'.join(lines) + '\n')
          PY
      - name: Generate and verify source and documentation contracts
        run: |
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
          git diff --check
      - name: Targeted visual and real application behavior regressions
        working-directory: docs
        run: |
          result=0
          npx playwright test --config=playwright.detail.config.ts workspace-plates.spec.ts reference-plate.spec.ts docs-reading.spec.ts || result=1
          cp test-results/detail-report.json "$RUNNER_TEMP/workspace-evidence/targeted-report.json"
          cp -R test-results/docs-browser "$RUNNER_TEMP/workspace-evidence/after"
          npm run test:browser || result=1
          exit "$result"
      - name: Prepare source-derived candidate for screenshot review
        run: |
          rm .github/workflows/workspace-reference-audit.yml
          npm run check:generated --prefix registry
          git add -A
          git diff --cached --check
          git diff --cached --stat > "$RUNNER_TEMP/workspace-evidence/change-stat.txt"
          git diff --cached > "$RUNNER_TEMP/workspace-evidence/source.patch"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'workspace-evidence'
          changes = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          entries=[]
          for name in changes:
              p=Path(name)
              entry={'path':name,'mode':'100644','type':'blob'}
              if p.exists():
                  entry['content']=p.read_text()
                  target=root/'source'/name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_text(entry['content'])
              else: entry['sha']=None
              entries.append(entry)
          body={'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree':entries}
          payload=Path(os.environ['RUNNER_TEMP'])/'workspace-tree.json'
          payload.write_text(json.dumps(body))
          response=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/andongmin94/neumorphism-ui/git/trees','--input',str(payload)],text=True))
          report={'tree':response['sha'],'parent':os.environ['GITHUB_SHA'],'sourceBaseline':'16daf6cf3cefa28335d5b7530b4c38355a85caad','run':os.environ['GITHUB_RUN_ID'],'changedFiles':changes,'published':False}
          (root/'candidate.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - name: Retain reports and observed screenshots even on failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/workspace-evidence/final-results"
          if [ -d docs/test-results ]; then cp -R docs/test-results/. "$RUNNER_TEMP/workspace-evidence/final-results/"; fi
          git diff > "$RUNNER_TEMP/workspace-evidence/working.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: workspace-reference-evidence
          path: ${{ runner.temp }}/workspace-evidence
          retention-days: 7
          if-no-files-found: error
