name: Resource finish review
on:
  status:
permissions:
  contents: read
jobs:
  candidate:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.context == 'Vercel' && github.event.state == 'success' &&
      github.event.sha == github.sha
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Apply reviewed authored changes without moving main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          sha = '7f1d2a074043ad6bab9880c0e72b998650e9dd00'
          blob = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}']))
          data = base64.b64decode(blob['content'])
          assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == sha
          script = pathlib.Path(os.environ['RUNNER_TEMP']) / 'resource-patch.py'
          script.write_bytes(data)
          subprocess.run(['python3', str(script)], check=True)
          PY
      - name: Generate and build from authored source
        run: |
          npm ci --prefix registry
          npm ci --prefix docs
          npm run lint --prefix registry
          npm run build --prefix registry
          npm run sync:docs --prefix registry
          npm test --prefix registry
          npm run check:generated --prefix registry
          npm run lint --prefix docs
          npm run typecheck --prefix docs
          npm run build --prefix docs
      - name: Targeted browser and source-only regressions
        working-directory: docs
        run: |
          npx playwright install --with-deps chromium
          result=0
          npx playwright test tests/browser/analytics.spec.ts tests/browser/workspaces.spec.ts || result=1
          npx playwright test --config=playwright.material.config.ts link-hub.spec.ts || result=1
          npx playwright test --config=playwright.detail.config.ts resource-copy.spec.ts || result=1
          exit "$result"
      - name: Prepare source-derived candidate tree for visual review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run check:generated --prefix registry
          git diff --check HEAD
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          repo = os.environ['GITHUB_REPOSITORY']; parent = os.environ['GITHUB_SHA']
          base = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/commits/{parent}']))
          paths = subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          paths += subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          tree = []
          for name in sorted(set(paths)):
              path = pathlib.Path(name); entry = dict(path=name,mode='100644',type='blob')
              if path.exists(): entry['content'] = path.read_text()
              else: entry['sha'] = None
              tree.append(entry)
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'resource-review'; out.mkdir(exist_ok=True)
          request = out/'tree-request.json'
          request.write_text(json.dumps(dict(base_tree=base['tree']['sha'],tree=tree)))
          result = json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/trees','--input',str(request)]))
          request.unlink()
          (out/'candidate.json').write_text(json.dumps(dict(parent=parent,tree=result['sha'],changed_paths=sorted(set(paths))),indent=2))
          (out/'candidate-source.json').write_text(json.dumps({e['path']:e.get('content') for e in tree},ensure_ascii=False))
          (out/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','--binary','HEAD']))
          print(json.dumps(dict(parent=parent,tree=result['sha'],files=len(tree))))
          PY
      - name: Record current audit and upstream versions without changing the release gate
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/resource-review"
          for project in registry docs; do
            npm audit --prefix "$project" --audit-level=high --json > "$RUNNER_TEMP/resource-review/$project-audit.json" || true
          done
          npm explain braces --prefix registry --json > "$RUNNER_TEMP/resource-review/braces-path.json" || true
          npm view braces version --json > "$RUNNER_TEMP/resource-review/braces-latest.json" || true
          npm view shadcn version --json > "$RUNNER_TEMP/resource-review/shadcn-latest.json" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: resource-candidate
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/resource-review
            docs/test-results
