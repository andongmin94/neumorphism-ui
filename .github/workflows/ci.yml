name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json

      - name: Install Registry
        run: npm ci
        working-directory: registry

      - name: Validate Registry
        run: npm run lint
        working-directory: registry

      - name: Build Registry
        run: npm run build
        working-directory: registry

      - name: Sync Registry to Docs
        run: npm run sync:docs
        working-directory: registry

      - name: Verify generated Registry output
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- registry/public/r docs/public/r)"
          if [[ -n "$changes" ]]; then
            echo "$changes"
            echo "Registry output is out of sync. Run the Registry build and commit both output directories."
            exit 1
          fi

      - name: Install Docs
        run: npm ci
        working-directory: docs

      - name: Lint Docs
        run: npm run lint
        working-directory: docs

      - name: Build Docs
        run: npm run build
        working-directory: docs

      - name: Test rendered Docs
        run: npm run test:ssr
        working-directory: docs
