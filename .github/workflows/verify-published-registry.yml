name: Published registry
on:
  workflow_dispatch:
  status:
permissions:
  contents: read
concurrency:
  group: published-registry-${{ github.event.sha || github.sha }}
  cancel-in-progress: false
env:
  EXPECTED_COMMIT: ${{ github.event.sha || github.sha }}
jobs:
  smoke:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.context == 'Vercel' && github.event.state == 'success' && github.event.sha == github.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs
      - name: Install one smoke-test browser
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Check core deployed pages and three representative registry endpoints
        working-directory: docs
        run: npm run test:smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: published-smoke
          path: |
            docs/test-results/published-browser
            docs/test-results/published-browser-report.json
          retention-days: 7
          if-no-files-found: error
