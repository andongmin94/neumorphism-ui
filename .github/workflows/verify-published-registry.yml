name: Published registry
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-registry-${{ github.ref }}
  cancel-in-progress: true
env:
  EXPECTED_COMMIT: ${{ github.sha }}
jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs
      - name: Wait for this commit to reach production
        working-directory: docs
        run: npm run verify:deployment
      - name: Install one smoke-test browser
        working-directory: docs
        run: npx playwright install --with-deps chromium
      - name: Check core deployed pages and three representative registry endpoints
        working-directory: docs
        run: npm run test:smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: published-smoke
          path: |
            docs/test-results/published-browser
            docs/test-results/published-browser-report.json
          retention-days: 7
          if-no-files-found: error
