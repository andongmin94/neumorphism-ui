name: Canonical registry review
on:
  push:
    branches: [main]
    paths: [.github/workflows/canonical-registry-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            registry/package-lock.json
            docs/package-lock.json
      - name: Restore immutable review scripts without interpolating a nested workflow
        run: |
          mkdir -p /tmp/canonical-registry-review
          git fetch --depth=1 origin 50a9c65ced0185793c5d9fb678ac312ad1c9fb02
          python - <<'PY'
          import subprocess
          from pathlib import Path
          source=subprocess.check_output(['git','show','50a9c65ced0185793c5d9fb678ac312ad1c9fb02:.github/workflows/canonical-registry-review.yml'],text=True)
          names={
            'probe':'Verify the repository-configured homepage with real public requests',
            'patch':'Correct authored origins and make public verification an actual deployment gate',
            'build':'Regenerate from authored source and validate contracts',
            'browser':'Verify canonical rendered output and repeated client-ready shortcut behavior',
          }
          for name,title in names.items():
            marker='      - name: '+title+'\n';assert source.count(marker)==1
            section=source.split(marker,1)[1].split('\n      - ',1)[0]
            body=section.split('        run: |\n',1)[1]
            lines=body.splitlines();assert all(not line or line.startswith('          ') for line in lines)
            Path('/tmp/canonical-registry-review/'+name+'.sh').write_text('\n'.join(line[10:] for line in lines)+'\n')
          PY
      - name: Reconfirm the registered public origin and apply the reviewed source corrections
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash -e /tmp/canonical-registry-review/probe.sh
          bash -e /tmp/canonical-registry-review/patch.sh
          python - <<'PY'
          from pathlib import Path
          p=Path('registry/scripts/verify-independent-items.mjs');s=p.read_text()
          a='    await run(npm, ["install", "--no-audit", "--no-fund"], directory, log);';assert s.count(a)==1
          s=s.replace(a,a+'''
              // Match the documented initialization: install the shared base once first.
              await run(process.execPath, [cli, "add", "--yes", "--cwd", directory, "@neumorphism-ui/neumorphism-ui"], root, log);
              assert.ok(fs.readFileSync(path.join(directory, "src/globals.css"), "utf8").includes("--neu-surface"), "Shared base tokens must be installed");''')
          a='import "../globals.css";';assert s.count(a)==1
          s=s.replace(a,a+' import "pretendard/dist/web/variable/pretendardvariable.css";')
          a='import "./globals.css";';assert s.count(a)==1
          s=s.replace(a,a+' import "pretendard/dist/web/variable/pretendardvariable.css";');p.write_text(s)
          public=Path('.github/workflows/verify-published-registry.yml').read_text()
          expression=chr(36)+'{{'
          assert public.count(expression)>=8
          assert 'EXPECTED_COMMIT: '+expression+' github.event.sha || github.sha }}' in public
          assert '--shard='+expression+' matrix.shard }}/3' in public
          assert '50a9c65ced0185793c5d9fb678ac312ad1c9fb02' not in public
          Path('/tmp/canonical-registry-review/published-workflow.yml').write_text(public)
          PY
      - name: Validate regenerated source, rendered docs and explicit shared-base installation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash -e /tmp/canonical-registry-review/build.sh
          node registry/scripts/verify-independent-items.mjs --shard=2/74
          cd docs
          bash -e /tmp/canonical-registry-review/browser.sh
      - name: Prepare reviewed product objects and leave workflow writes to GitHub MCP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess,tarfile,urllib.request,urllib.error
          from pathlib import Path
          allowed={'.github/workflows/verify-published-registry.yml','README.md','QUALITY.md','docs/press.config.tsx','docs/components/docs/request-origin.ts','docs/components/docs/registry-config.ts','registry/catalog.json','registry/directory-entry.json','registry/tests/directory-entry.test.mjs','registry/tests/canonical-origin.test.mjs','registry/scripts/verify-independent-items.mjs','registry/scripts/verify-published-registry.mjs','docs/tests/browser/docs-polish.spec.ts','docs/visual-reference.md','docs/playwright.published.config.ts','docs/tests/browser/registry-origin.spec.ts','registry/registry.json','registry/public/r/registry.json','docs/public/r/registry.json'}
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          changed=set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())
          assert changed==allowed,(changed,allowed)
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip()
          entries=[{'path':p,'mode':'100644','type':'blob','content':Path(p).read_text()} for p in sorted(changed) if not p.startswith('.github/')]
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',data=json.dumps({'base_tree':base,'tree':entries}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          try:
            with urllib.request.urlopen(request) as response: created=json.load(response)
          except urllib.error.HTTPError as error:
            print(error.read().decode());raise
          Path('/tmp/canonical-registry-review/tested-tree.json').write_text(json.dumps({'parent':os.environ['GITHUB_SHA'],'tree':created['sha'],'files':sorted(changed),'workflowMustBeAppliedThroughMCP':'.github/workflows/verify-published-registry.yml','removeWorkflow':'.github/workflows/canonical-registry-review.yml'},indent=2))
          Path('/tmp/canonical-registry-review/changes.diff').write_bytes(subprocess.check_output(['git','diff','HEAD']))
          with tarfile.open('/tmp/canonical-registry-review/reviewed-source.tar.gz','w:gz') as archive:
            for p in sorted(changed): archive.add(p,arcname=p)
          PY
      - name: Preserve actual HTTP, initialization and browser evidence
        if: always()
        run: |
          if [ -d docs/test-results ]; then cp -R docs/test-results /tmp/canonical-registry-review/; fi
          git diff HEAD > /tmp/canonical-registry-review/working.diff
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: canonical-registry-review
          path: /tmp/canonical-registry-review
          retention-days: 7
          if-no-files-found: error
